<style>
:root{--red:#e53d32;--red-d:#b92c23;--ink:#202124;--muted:#6f7378;--cream:#fff8f3;--line:#eee5df;--green:#16865b;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{cursor:not-allowed}
input,textarea{font:inherit;font-size:16px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #ffb3aa;outline-offset:2px}
h1,h2,h3{margin:0}
.note{color:var(--muted)}
.err{color:var(--err);background:#fff;border:1px solid var(--err);padding:12px;border-radius:12px}
.warn{background:#fdecea;border:1px solid #f5b5ae;padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
.warn[hidden]{display:none}

/* üst şerit + gezinme */
.top{background:var(--ink);color:#fff;text-align:center;padding:9px 16px;font-size:13px}
.top b{color:#ff5a4d}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(20px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-family:Poppins,Inter,ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.8px;line-height:1}
.brand span:not(.logo){color:var(--red)}

.logo{display:grid;place-items:center;width:42px;height:42px;background:none;color:var(--red);font-size:23px}
.navright{display:flex;align-items:center;gap:10px;min-width:0}
.mail{font-size:13px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.ghost:hover{border-color:#ffc2b7;color:var(--red)}
.cartbtn{background:var(--red);color:#fff;border-radius:13px;padding:12px 16px;font-weight:750;white-space:nowrap}

.wrap{max-width:1180px;margin:auto;padding:24px 20px}
.narrow{max-width:560px;margin:auto}

/* hero */
.hero{background:linear-gradient(115deg,#fff0e4,#fff8f3 55%,#ffe2d5);border-radius:26px;display:grid;grid-template-columns:1.2fr .8fr;overflow:hidden;min-height:275px;align-items:center}
.herotext{padding:38px 42px}
.eyebrow{color:var(--red);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1.3px}
.hero h1{font-size:clamp(32px,4vw,50px);line-height:1.06;letter-spacing:-1.7px;margin:12px 0}
.hero p{color:#68615d;max-width:440px;line-height:1.6;margin:0 0 22px}
.search{display:flex;max-width:480px;background:#fff;padding:6px;border:1px solid #f0ddd2;border-radius:15px;box-shadow:0 8px 24px #5b2b1010}
.search input{border:0;outline:0;min-width:0;flex:1;padding:10px 12px;border-radius:10px}
.search input:focus-visible{outline:0}
.search:focus-within{border-color:var(--red)}
.heroart{height:100%;min-height:250px;display:grid;place-items:center;font-size:150px;position:relative;overflow:hidden}
.heroart:before,.heroart:after{content:"";position:absolute;border-radius:50%;background:#ffc9a6;opacity:.55}
.heroart:before{width:230px;height:230px}
.heroart:after{width:170px;height:170px;background:#f4a17c}
.heroart span{z-index:1;filter:drop-shadow(0 15px 10px #a33b2430);transform:rotate(-8deg)}
.heroart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.hero.rest p{margin-bottom:14px}

.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 16px}
.sectionhead h2{font-size:23px;letter-spacing:-.6px}
.sectionhead p{margin:5px 0 0;color:var(--muted);font-size:14px}

/* kategori ve filtre */
.cats{display:flex;gap:12px;overflow-x:auto;padding:2px 0 8px}
.cat{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:15px;background:#fff;font-weight:700}
.cat .thumb{position:relative;flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:22px;background:#fff0e4}
.cat .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat{padding:8px 16px 8px 8px}
.cat.active,.cat:hover{border-color:#ffc2b7;background:#fff2ef;color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{padding:8px 13px;border:1px solid var(--line);background:#fff;border-radius:99px;color:#57595d;font-size:13px}
.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* kartlar */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:19px;overflow:hidden;background:#fff;transition:.2s}
button.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #2b1a120d}
.card.off{opacity:.72}
.foodpic{height:155px;display:grid;place-items:center;font-size:77px;background:linear-gradient(135deg,#fff0e4,#ffe1cf);position:relative;overflow:hidden}
.foodpic.green{background:linear-gradient(135deg,#e5f5e8,#cde9d2)}
.foodpic.yellow{background:linear-gradient(135deg,#fff6d9,#ffe5a4)}
.foodpic.pink{background:linear-gradient(135deg,#ffe9e4,#ffc9c0)}
.foodpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:12px;top:12px;z-index:2;background:#fff;color:var(--green);border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800}
.tag.off{background:var(--ink);color:#fff}
.cardbody{padding:15px;display:block}
.card h3,.card .name{display:block;font-size:17px;font-weight:800;margin:0 0 5px}
.meta{display:block;font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.cardbottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f4efeb;padding-top:12px;margin-top:4px}
.price{font-weight:850}
.add{background:#fff0ed;color:var(--red);font-size:20px;font-weight:800;width:38px;height:38px;border-radius:11px}
.add:hover:not(:disabled){background:var(--red);color:#fff}
.add:disabled{opacity:.4}
.qty{display:flex;align-items:center;gap:9px}
.qty button{background:#fff0ed;color:var(--red);border-radius:8px;width:30px;height:30px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips i{font-style:normal;font-weight:600;font-size:13px;background:#fff;border:1px solid #f0ddd2;border-radius:99px;padding:6px 12px}
.badge{display:inline-block;font-style:normal;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:#d6f0e3;color:#0a5a33}
.badge.off{background:var(--ink);color:#fff}
.back{color:var(--red);font-weight:700;padding:6px 0;margin-bottom:12px}
.empty{grid-column:1/-1;padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}

/* yemek arama sonuçları */
.dishes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dish{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);border-radius:15px;padding:13px 15px;background:#fff}
.dish:hover{border-color:#ffc2b7;background:#fff8f6}
.dish b{display:block}
.dish small{color:var(--muted)}
.dish .price{white-space:nowrap}

/* form ve paneller */
.panel{border:1px solid var(--line);border-radius:19px;padding:4px 20px 20px}
label{display:block;font-weight:700;margin:14px 0 5px;font-size:14px}
.go{width:100%;background:var(--red);color:#fff;border-radius:13px;font-weight:800;padding:15px;margin-top:14px}
.go:disabled{opacity:.5}
.sw{color:var(--red);font-weight:700;margin-top:12px;padding:6px 0}
.ok{text-align:center;border:1px solid var(--line);border-radius:19px;padding:30px 20px}
.ok .tick{width:72px;height:72px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:38px;margin:0 auto 12px}
.narrow h2.title{font-size:26px;letter-spacing:-.6px;margin-bottom:6px}
.info{color:var(--muted);margin:0 0 8px}

/* sepet çekmecesi */
.overlay{position:fixed;inset:0;background:#14141470;z-index:10;display:none;justify-content:flex-end}
.overlay.open{display:flex}
.drawer{background:#fff;width:min(430px,100%);height:100%;padding:24px;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0002}
.drawhead{display:flex;justify-content:space-between;align-items:center}
.drawhead h2{font-size:22px}
.drawhead small{color:var(--muted);display:block;margin-top:2px}
.close{font-size:24px;background:#f5f5f5;border-radius:10px;width:40px;height:40px}
.cartitems{flex:1;overflow:auto;margin:18px 0}
.cartrow{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.cartrow .info{flex:1;margin:0}
.cartrow strong{display:block}
.cartrow small{color:var(--muted)}
.totals{border-top:1px solid var(--line);padding-top:15px}
.totalrow{display:flex;justify-content:space-between;margin:8px 0;color:#5d5f63}
.grand{font-size:19px;color:var(--ink);font-weight:850}
.checkout{background:var(--red);color:#fff;width:100%;padding:15px;border-radius:13px;font-weight:800;margin-top:12px}
.checkout:disabled{opacity:.5}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:20;display:none;box-shadow:0 8px 25px #0002}
.toast.show{display:block}
footer{background:var(--ink);color:#fff;padding:30px 20px;margin-top:35px}
.foot{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center}
.flinks{max-width:1180px;margin:0 auto 24px;padding-bottom:24px;border-bottom:1px solid #ffffff22;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 24px}.flinks button{text-align:left;color:#fff;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#ffffff66}.flinks button:hover{text-decoration-color:#fff}@media(max-width:700px){.flinks{grid-template-columns:1fr 1fr}}
.page{max-width:820px;margin:auto}.page h1{font-size:30px;letter-spacing:-.8px;margin:4px 0 6px}.page .lead{color:var(--muted);margin:0 0 20px}.page h2{font-size:18px;margin:24px 0 8px}.page p,.page li{line-height:1.65;color:#3c3f43;font-size:15px}.page ul{padding-left:20px}.page .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:10px 0}.page details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0}.page summary{font-weight:700;cursor:pointer}.page details p{margin:10px 0 0}.page .note{background:#fff5f1;border:1px dashed #ffb8a8;border-radius:12px;padding:12px 14px;color:var(--red-d);font-size:13.5px;margin:18px 0}.page .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.page .chipc{display:flex;flex-wrap:wrap;gap:8px}.page .chipc span{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600}.page .chipc span.on{background:#fff2ef;border-color:#ffc2b7;color:var(--red)}.page .pform input,.page .pform textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#fff}.page .pform button.go{margin-top:8px}@media(max-width:700px){.page .grid2{grid-template-columns:1fr}.page h1{font-size:25px}}
.foot p{color:#c3c4c6;font-size:13px;margin:6px 0 0}

.chips i.feebox,.feebox{display:inline-flex;align-items:center;gap:6px;border:2px dashed #ffb8a8;background:#fff5f1;color:var(--red-d);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700}
body{padding-bottom:92px}
.toast{bottom:96px}
.tabs{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));display:flex;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px #2b1a1218;padding:6px;z-index:8}
.tabs button{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 2px;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button b{font-size:20px;line-height:1}
.tabs button.on{background:#fff2ef;color:var(--red)}
.heart{position:absolute;right:10px;top:10px;z-index:3;background:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 8px #0002;cursor:pointer}
.locbar{margin-bottom:14px;position:relative}.locbtn{background:#fff;border:1px solid var(--line);border-radius:99px;padding:10px 16px;font-weight:750;font-size:14px}.locbtn:hover{border-color:#ffc2b7;color:var(--red)}.locpanel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px;max-width:420px;box-shadow:0 10px 30px #0001}.locpanel label{display:block;font-weight:700;font-size:13px;margin:8px 0 4px}.locpanel select,.locpanel input{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}
.citybar{margin-bottom:12px;font-weight:700}
.citybar select{width:auto;padding:8px 12px;border-radius:99px}
select{font:inherit;font-size:16px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
/* restoran paneli */
#pnl{max-width:760px}#pnl .prow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#pnl .prow button{flex:1;min-width:130px}
.ptabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.ptabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font-weight:750;font-size:14px;white-space:nowrap}
.ptabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.ptabs i{font-style:normal;background:#fff;color:var(--red);border-radius:99px;padding:1px 7px;margin-left:4px;font-size:12px;font-weight:800}
.pit{margin:8px 0;padding-left:20px;font-weight:650}.ocard.fresh{border-color:var(--red);box-shadow:0 0 0 3px #e8412c22}
.pmi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.pmi button{border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-weight:750;font-size:13px;white-space:nowrap}
.pmi button.off{background:var(--ink);color:#fff;border-color:var(--ink)}
#pnl select{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}
.ocard{border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.otrack{display:flex;gap:4px;margin:10px 0 4px}
.otrack i{flex:1;height:7px;border-radius:9px;background:#eee5df}
.otrack i.on{background:var(--green)}
.wa{display:block;width:100%;text-align:center;background:#25d366;color:#fff;border-radius:13px;padding:14px;font-weight:800;margin-top:12px}
.tabs .ic{width:22px;height:22px}
.radio{display:flex;gap:8px;align-items:center;font-weight:600;margin:8px 0}
.radio input{width:auto}
.search select{width:auto;max-width:130px;border:0;border-right:1px solid var(--line);border-radius:10px 0 0 10px;padding:10px 8px;font-weight:700}
.rv{margin-top:8px}
@media(max-width:760px){
  .nav{padding:12px 16px}
  .brand{font-size:19px}
  .logo{width:36px;height:36px}.logo svg{width:36px;height:36px}
  .mail{display:none}
  .hero{grid-template-columns:1fr;min-height:0}
  .herotext{padding:28px 22px 10px}
  .heroart{min-height:120px;font-size:95px}
  .heroart:before{width:140px;height:140px}
  .heroart:after{width:105px;height:105px}
  .wrap{padding:18px 14px}
  .grid,.dishes{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .dishes{grid-template-columns:1fr}
  .foodpic{height:125px;font-size:60px}
  .cardbody{padding:12px}
  .card h3,.card .name{font-size:15px}
  .meta{font-size:12px}
  .sectionhead{margin-top:25px}
  .cartbtn{padding:10px 12px;font-size:13px}
  .foot{align-items:flex-start;flex-direction:column}
}
@media(max-width:390px){.grid{grid-template-columns:1fr}.foodpic{height:150px}.hero h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.card,.ocard{box-shadow:0 1px 2px #00000008,0 12px 28px -18px #00000040;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 14px 32px -16px #00000055}.go{box-shadow:0 8px 16px -8px #e53d32bb}
</style>
</head>
<body>

<script>
const SB_URL = 'https://bspjvnxnofkhnocjwsjb.supabase.co';
const SB_KEY = 'sb_publishable_LYozx29A9SxRFBEXLkxftg_28peojyK';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tl = n => Number(n).toLocaleString('tr-TR', {maximumFractionDigits: 2}) + ' ₺';
const norm = s => String(s ?? '').toLocaleLowerCase('tr').trim();

// Kart arka plan rengi: kimliğe göre sabit seçilir
const TONES = ['', 'green', 'yellow', 'pink'];
const tone = id => { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return TONES[h % TONES.length]; };
// Fotoğraf varsa üstte görünür, yoksa (veya açılmazsa) emoji kalır
const pic = (url, emoji, id, extra = '') => `<div class="foodpic ${tone(id)}"><span>${esc(emoji || '🍽️')}</span>${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : ''}${extra}</div>`;

let toastTimer;
function toast(s) { const el = $('#toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000); }

if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location = window.self.location; } catch (e) {} }
// Bozuk görseller sessizce kaldırılır
document.addEventListener('error', e => { if (e.target && e.target.tagName === 'IMG') e.target.remove(); }, true);

/* ---------- oturum ---------- */
async function signOut() {
  const t = sess && sess.token;
  save(null);
  try { Object.keys(localStorage).filter(k => k.startsWith('addr_') || k === 'st').forEach(k => localStorage.removeItem(k)); } catch (e) {}
  if (t) { try { await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + t } }); } catch (e) {} }
}
let sess = null;
try { sess = JSON.parse(localStorage.getItem('sess') || 'null'); } catch (e) {}
const save = s => { sess = s; try { s ? localStorage.setItem('sess', JSON.stringify(s)) : localStorage.removeItem('sess'); } catch (e) {} };
const hdr = () => ({ apikey: SB_KEY, 'Content-Type': 'application/json', ...(sess ? { Authorization: 'Bearer ' + sess.token } : {}) });
const who = () => { $('#who').innerHTML = sess ? `<span class="mail">${esc(sess.email)}</span><button class="ghost" data-out>Çıkış</button>` : '<button class="ghost" data-in>Giriş</button>'; updateCart(); };

const auth = async (path, body) => {
  const r = await fetch(SB_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'İşlem başarısız');
  return j;
};
const toSess = j => ({ token: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000, uid: j.user.id, email: j.user.email });

const api = async path => {
  await fresh();
  let r = await fetch(SB_URL + '/rest/v1/' + path, { headers: hdr() });
  if (r.status === 401 && sess) { save(null); who(); r = await fetch(SB_URL + '/rest/v1/' + path, { headers: hdr() }); }
  if (!r.ok) throw new Error('Sunucu hatası: ' + r.status);
  return r.json();
};
const fail = e => { $('#app').innerHTML = `<div class="wrap"><p class="err">Veriler alınamadı. İnternet bağlantını ve Supabase projenin açık olduğunu kontrol et. (${esc(e.message)})</p></div>`; };

/* ---------- durum ---------- */
let cuis = [], rests = {}, loaded = false, current = null, prods = [], cats = [];
let cat = 'all', sortMode = 'name', onlyOpen = false, sTok = 0, dTimer;

/* ---------- sepet (tarayıcıda saklanır) ---------- */
const isId = v => typeof v === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
const MAXQ = 30;
let cart = { rid: null, lines: {} };
try {
  const c = JSON.parse(localStorage.getItem('cart') || 'null');
  if (c && c.rid && c.lines && typeof c.lines === 'object') {
    const lines = {};
    for (const [id, l] of Object.entries(c.lines)) if (isId(id) && l && l.q > 0 && isFinite(Number(l.price))) lines[id] = { name: String(l.name || '').slice(0, 120), price: Math.max(0, Number(l.price)), q: Math.min(MAXQ, Math.floor(l.q)) };
    if (isId(c.rid) && Object.keys(lines).length) cart = { rid: c.rid, lines };
  }
} catch (e) {}
const saveCart = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {} };
const cartLines = () => Object.entries(cart.lines);
const cartCount = () => cartLines().reduce((s, [, l]) => s + l.q, 0);
const cartSub = () => cartLines().reduce((s, [, l]) => s + l.q * Number(l.price), 0);
const clearCart = () => { cart = { rid: null, lines: {} }; saveCart(); };

function add(id) {
  const p = prods.find(x => x.id === id);
  if (!p || !current) return;
  if (cartCount() && cart.rid !== current.id) {
    if (!confirm('Sepetinde başka bir restoranın ürünleri var. Sepeti temizleyip bu restorandan devam edelim mi?')) return;
    clearCart();
  }
  cart.rid = current.id;
  const l = cart.lines[id] || (cart.lines[id] = { name: p.name, price: eff(p), q: 0 });
  if (l.q >= MAXQ) return toast('Bir üründen en fazla ' + MAXQ + ' adet alınabilir');
  l.q++;
  saveCart(); updateCart(); drawMenu(); toast('Sepete eklendi ✓');
}
function change(id, d) {
  const l = cart.lines[id];
  if (!l) return;
  l.q += d;
  if (l.q <= 0) delete cart.lines[id];
  if (!cartCount()) cart.rid = null;
  saveCart(); updateCart(); drawMenu();
}

function updateCart() {
  const n = cartCount(), r = rests[cart.rid];
  $('#cartcount').textContent = n;
  $('#drawrest').textContent = n && r ? r.name : '';
  $('#cartitems').innerHTML = n
    ? cartLines().map(([id, l]) => `<div class="cartrow"><div class="info"><strong>${esc(l.name)}</strong><small>${tl(l.price)}</small></div><div class="qty"><button data-dec="${esc(id)}" aria-label="Azalt">−</button><b>${l.q}</b><button data-inc="${esc(id)}" aria-label="Artır">+</button></div></div>`).join('')
    : '<div class="empty">Sepetin şimdilik boş 🍽️<br>Menüden ürün ekle.</div>';
  if (!n) { $('#drawfoot').innerHTML = ''; return; }
  const fee = r ? Number(r.delivery_fee) : 0, min = r ? Number(r.min_order_amount) : 0, sub = cartSub();
  const low = sub < min, closed = r && !r.is_open;
  $('#drawfoot').innerHTML = `<div class="totalrow"><span>Ara toplam</span><strong>${tl(sub)}</strong></div><div class="totalrow"><span>Teslimat</span><strong>${tl(fee)}</strong></div><div class="totalrow grand"><span>Toplam</span><strong>${tl(sub + fee)}</strong></div>`
    + (low ? `<div class="warn">Minimum sipariş tutarı ${tl(min)}. ${tl(min - sub)} daha ekle.</div>` : '')
    + (closed ? '<div class="warn">Restoran şu an kapalı.</div>' : '')
    + `<button class="checkout" data-go ${low || closed ? 'disabled' : ''}>${sess ? 'Siparişi tamamla' : 'Giriş yap ve siparişi tamamla'}</button>`;
}
const openCart = () => { updateCart(); $('#overlay').classList.add('open'); };
const closeCart = () => $('#overlay').classList.remove('open');

/* ---------- şehir, adres, favori, sekmeler ---------- */
const CITIES = 'Adana,Adıyaman,Afyonkarahisar,Ağrı,Aksaray,Amasya,Ankara,Antalya,Ardahan,Artvin,Aydın,Balıkesir,Bartın,Batman,Bayburt,Bilecik,Bingöl,Bitlis,Bolu,Burdur,Bursa,Çanakkale,Çankırı,Çorum,Denizli,Diyarbakır,Düzce,Edirne,Elazığ,Erzincan,Erzurum,Eskişehir,Gaziantep,Giresun,Gümüşhane,Hakkari,Hatay,Iğdır,Isparta,İstanbul,İzmir,Kahramanmaraş,Karabük,Karaman,Kars,Kastamonu,Kayseri,Kilis,Kırıkkale,Kırklareli,Kırşehir,Kocaeli,Konya,Kütahya,Malatya,Manisa,Mardin,Mersin,Muğla,Muş,Nevşehir,Niğde,Ordu,Osmaniye,Rize,Sakarya,Samsun,Şanlıurfa,Siirt,Sinop,Sivas,Şırnak,Tekirdağ,Tokat,Trabzon,Tunceli,Uşak,Van,Yalova,Yozgat,Zonguldak'.split(',');
const DIST = { Isparta: ['Merkez', 'Eğirdir', 'Yalvaç', 'Şarkikaraağaç', 'Senirkent', 'Gelendost', 'Gönen', 'Keçiborlu', 'Atabey', 'Aksu', 'Sütçüler', 'Uluborlu', 'Yenişarkaraağaç'], Gaziantep: ['Şahinbey', 'Şehitkamil', 'Oğuzeli', 'Nizip', 'İslahiye', 'Nurdağı', 'Karkamış', 'Araban', 'Yavuzeli'] };
const WA = '905333933203'; // WhatsApp hattı: başında 90, boşluksuz yaz
let cityOn = true, myDist = '', myCity = 'Isparta', curTab = 'home', favs = [], coupon = null, revs = [];
try { myCity = localStorage.getItem('city') || myCity; myDist = localStorage.getItem('dist') || ''; favs = JSON.parse(localStorage.getItem('favs') || '[]'); } catch (e) {}
const sameCity = (r, c) => !r.city || norm(r.city) === norm(c);
const serves = (r, c, d) => sameCity(r, c) && (!r.district || !d || norm(r.district) === norm(d) || (Array.isArray(r.delivery_districts) ? r.delivery_districts : []).some(x => norm(x) === norm(d)));
let farFallback = false;
const inHrs = r => { const m = v => { const [h, k] = String(v).split(':'); return (+h) * 60 + (+k || 0); }, n = new Date(), t = n.getHours() * 60 + n.getMinutes(), a = m(r.open_time), z = m(r.close_time); return a <= z ? t >= a && t < z : t >= a || t < z; };
const vis = () => {
  const all = Object.values(rests).filter(r => r.is_active !== false && sameCity(r, myCity));
  const near = all.filter(r => serves(r, myCity, myDist));
  farFallback = !!myDist && near.length === 0 && all.length > 0;
  return farFallback ? all : near;
};
const addrKey = () => 'addr_' + (sess ? sess.uid : 'guest');
const getAddr = () => { try { return JSON.parse(localStorage.getItem(addrKey()) || 'null'); } catch (e) { return null; } };
const setAddr = a => { try { localStorage.setItem(addrKey(), JSON.stringify(a)); } catch (e) {} };
const okName = x => typeof x === 'string' && x.length <= 40 && /^[\p{L}\s.'’-]+$/u.test(x);
async function loadDist(c) {
  if (DIST[c]) return DIST[c];
  try {
    const k = 'dist_' + c, cached = localStorage.getItem(k);
    if (cached) {
      const d = JSON.parse(cached);
      if (Array.isArray(d) && d.length && d.every(okName)) return (DIST[c] = d);
    }
    const j = await (await fetch('https://turkiyeapi.dev/api/v1/provinces?name=' + encodeURIComponent(c))).json();
    const p = j.data.find(x => x.name === c) || j.data[0];
    const d = p.districts.map(x => x.name).filter(okName).sort((a, b) => a.localeCompare(b, 'tr'));
    if (d.length) { DIST[c] = d; localStorage.setItem(k, JSON.stringify(d)); return d; }
  } catch (e) {}
  return null;
}
async function fillDist(c, v) { const d = await loadDist(c); if (d && $('#dsw') && $('#ct') && $('#ct').value === c) $('#dsw').innerHTML = distField(c, v); }
const distField = (c, v) => DIST[c] ? `<select id="ds">${DIST[c].map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>` : `<input id="ds" placeholder="İlçe" value="${esc(v)}">`;
function addrForm(a) {
  a = a || {}; const c = a.city || myCity;
  return `<label for="a1">Açık adres (mahalle, sokak, bina, kapı no)</label><input id="a1" autocomplete="street-address" value="${esc(a.address_line1)}">
<label for="ct">Şehir</label><select id="ct">${CITIES.map(x => `<option ${x === c ? 'selected' : ''}>${x}</option>`).join('')}</select>
<label for="ds">İlçe</label><div id="dsw">${distField(c, a.district)}</div>${(setTimeout(() => fillDist(c, a.district), 0), '')}
<label for="pc">Posta kodu</label><input id="pc" inputmode="numeric" autocomplete="postal-code" value="${esc(a.postal_code)}">
<label for="ph">Telefon</label><input id="ph" type="tel" autocomplete="tel" value="${esc(a.phone)}">
<label for="nt">Kurye notu (isteğe bağlı)</label><textarea id="nt" rows="2">${esc(a.delivery_instructions)}</textarea>`;
}
function saveAddr() {
  const v = id => $('#' + id).value.trim(), el = $('#aerr2');
  const a = { address_line1: v('a1'), city: v('ct'), district: v('ds'), postal_code: v('pc'), country_code: 'TR', phone: v('ph'), delivery_instructions: v('nt') };
  if (!a.address_line1 || !a.postal_code || !a.phone) { el.hidden = false; el.textContent = 'Adres, posta kodu ve telefonu doldur.'; return; }
  el.hidden = true; setAddr(a); myCity = a.city; myDist = a.district || '';
  try { localStorage.setItem('city', myCity); localStorage.setItem('dist', myDist); } catch (e) {}
  toast('Adres kaydedildi ✓');
}
const flashOn = p => p.flash_price != null && new Date(p.flash_until) > new Date();
const eff = p => flashOn(p) ? Number(p.flash_price) : Number(p.price);
const stars = n => Math.min(5, Math.max(0, Math.round(Number(n)) || 0));
const avg = () => (revs.reduce((t, x) => t + stars(x.rating), 0) / revs.length).toFixed(1);
const revHtml = () => revs.length ? `<div class="sectionhead"><div><h2>Yorumlar</h2><p>★ ${avg()} · ${revs.length} değerlendirme</p></div></div>${revs.slice(0, 3).map(x => `<div class="ocard"><b>${'★'.repeat(stars(x.rating))}</b><p class="info">${esc(x.comment || '')}</p></div>`).join('')}` : '';
const heart = id => `<span class="heart" data-fav="${esc(id)}" role="button" aria-label="Favori">${favs.includes(id) ? '❤️' : '🤍'}</span>`;
function toggleFav(id) {
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
  try { localStorage.setItem('favs', JSON.stringify(favs)); } catch (e) {}
  if (curTab === 'fav') favView(); else if ($('#list')) fillHome();
}
function openWA(id) {
  if (/X/.test(WA)) return toast('WhatsApp numarası henüz eklenmedi');
  const t = id ? 'Merhaba, ' + id + ' numaralı siparişim hakkında yardım istiyorum.' : 'Merhaba, Akar Yemek siparişim hakkında yardım istiyorum.';
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(t), '_blank', 'noopener');
}
async function fresh() {
  if (sess && sess.exp < Date.now()) {
    try { save(toSess(await auth('token?grant_type=refresh_token', { refresh_token: sess.refresh }))); } catch (e) { save(null); who(); }
  }
}
const setTab = t => { curTab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); };
const ensureLoaded = async () => { if (!loaded) await home(); };
function tabView(t) {
  closeCart(); current = null; scrollTo(0, 0);
  if (t === 'home') return home();
  setTab(t);
  return ({ fav: favView, orders: ordersView, promo: promoView, acc: accView })[t]();
}
async function favView() {
  await ensureLoaded(); setTab('fav');
  const L = vis().filter(r => favs.includes(r.id));
  $('#app').innerHTML = `<div class="wrap"><div class="sectionhead"><div><h2>Favorilerim</h2><p>Kalbini bıraktığın restoranlar</p></div></div><section class="grid">${L.length ? L.map(restCard).join('') : '<div class="empty">Henüz favorin yok. Restoran kartındaki 🤍 simgesine dokun.</div>'}</section></div>`;
}
const STEPS = [['pending', 'Sipariş alındı'], ['accepted', 'Onaylandı'], ['preparing', 'Hazırlanıyor'], ['out_for_delivery', 'Yolda'], ['delivered', 'Teslim edildi']];
async function ordersView() {

const authMsg = m => {
  m = String(m || '');
  if (/invalid login|invalid_credentials/i.test(m)) return 'E-posta veya şifre hatalı.';
  if (/not confirmed/i.test(m)) return 'E-postan henüz doğrulanmamış.';
  if (/expired|invalid.*(token|otp)|token.*invalid|otp/i.test(m)) return 'Kod hatalı ya da süresi dolmuş. Yeni kod isteyebilirsin.';
  if (/already registered|already been registered/i.test(m)) return 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
  if (/password.*(short|least|characters)|weak/i.test(m)) return 'Şifre en az 6 karakter olmalı.';
  if (/valid email|invalid.*email|unable to validate email/i.test(m)) return 'Geçerli bir e-posta adresi yaz.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Çok fazla deneme yapıldı. Bir dakika bekleyip tekrar dene.';
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.';
  return m || 'İşlem başarısız.';
};
let authBusy = false, authFails = 0, authLock = 0;
async function doAuth(mode) {
  if (authBusy) return;
  const email = $('#em').value.trim().toLowerCase(), password = $('#pw').value, el = $('#aerr'), btn = document.querySelector('[data-submit]');
  el.hidden = false;
  if (!email || !password) { el.textContent = 'E-posta ve şifreyi yaz.'; return; }
  if (Date.now() < authLock) { el.textContent = 'Çok fazla deneme yaptın. ' + Math.ceil((authLock - Date.now()) / 1000) + ' saniye sonra tekrar dene.'; return; }
  if (mode === 'signup' && (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password))) { el.textContent = 'Şifre en az 8 karakter olmalı ve hem harf hem rakam içermeli.'; return; }
  authBusy = true; if (btn) btn.disabled = true; el.textContent = 'Bekle…';
  try {
    const j = mode === 'signup' ? await auth('signup', { email, password }) : await auth('token?grant_type=password', { email, password });
    if (!j.access_token) {
      if (j.user && Array.isArray(j.user.identities) && !j.user.identities.length) { el.textContent = 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.'; return; }
      return codeView(email);
    }
    authFails = 0; save(toSess(j)); who();
    afterLogin();
  } catch (e) {
    if (/not confirmed/i.test(e.message || '')) { try { await auth('resend', { type: 'signup', email }); } catch (_) {} return codeView(email, 'E-postan henüz doğrulanmamış. Sana yeni bir kod gönderdik.'); }
    if (++authFails >= 5) { authLock = Date.now() + 60000; authFails = 0; } el.textContent = authMsg(e.message);
  }
  finally { authBusy = false; if (btn) btn.disabled = false; }
}

const afterLogin = () => cartCount() ? checkout() : (getAddr() ? home() : accView());

async function verifyCode() {
  if (authBusy) return;
  const el = $('#cderr'), btn = document.querySelector('[data-verify]');
  const token = ($('#cd').value || '').replace(/\s+/g, '');
  el.hidden = false;

  authBusy = true; if (btn) btn.disabled = true; el.textContent = 'Bekle…';

async function resendCode() {

  if (r.city && norm(r.city) !== norm(addr.city)) { el.textContent = r.name + ' yalnızca ' + r.city + ' şehrine teslimat yapıyor.'; return; }
  if (!serves(r, addr.city, addr.district)) { el.textContent = r.name + ' yalnızca ' + r.district + ' ilçesine' + ((r.delivery_districts || []).length ? ' ve ' + r.delivery_districts.join(', ') + ' ilçelerine' : '') + ' teslimat yapıyor.'; return; }

    const base = { p_customer_id: sess.uid, p_restaurant_id: cart.rid, p_delivery_address: addr, p_items: items };
    const post = (fn, b) => fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: hdr(), body: JSON.stringify(b) });

    let res = await post('place_order_v2', { ...base, p_coupon: coupon ? coupon.code : null, p_payment: pay });
    const j = await res.json().catch(() => ({}));
    if (res.status === 401) { save(null); who(); return authView('login'); }

}

      const o = c.createOscillator(), g = c.createGain(), at = c.currentTime + t;
      o.type = 'square'; o.frequency.value = 880; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.25, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + .22);
      o.start(at); o.stop(at + .24);
    });
  } catch (e) {}
}
async function panelView() {
  await ensureLoaded(); setTab('acc');
  if (!sess) return authView('login');
  const mine = myRests();
  if (!mine.length) { $('#app').innerHTML = '<div class="wrap"><div class="narrow"><h2 class="title">Restoran paneli</h2><div class="empty">Bu hesaba bağlı restoran yok.</div></div></div>'; return; }
  if (!pnl.rid || !rests[pnl.rid] || rests[pnl.rid].owner_id !== sess.uid) pnl.rid = mine[0].id;
  pnl.seen = null; pnl.tab = 'new'; pnl.orders = []; pnl.menu = null;
  drawPanel(); renderPanel();
  scrollTo(0, 0);
  await pollPanel();
  clearInterval(pnl.timer);
  pnl.timer = setInterval(() => { if (!$('#pnl')) return clearInterval(pnl.timer); pollPanel(); }, 8000);
}
function drawPanel() {
  const r = rests[pnl.rid], mine = myRests(), open = r.is_open !== false;
  $('#app').innerHTML = `<div class="wrap"><div class="narrow" id="pnl"><h2 class="title">Restoran paneli</h2>
${mine.length > 1 ? `<select id="prest">${mine.map(x => `<option value="${esc(x.id)}" ${x.id === pnl.rid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : `<p class="info"><b>${esc(r.name)}</b></p>`}
<div class="prow"><button class="${open ? 'ghost' : 'go'}" data-popen>${open ? '🟢 Açık · kapatmak için dokun' : '🔴 Kapalı · açmak için dokun'}</button><button class="ghost" data-psound>${pnl.sound ? '🔔 Ses açık' : '🔕 Yeni sipariş sesini aç'}</button></div>
<div class="ptabs" id="ptabs"></div><div id="pbody"></div></div></div>`;
}
function pOrderCard(o) {
  const a = o.delivery_address || {}, its = pnl.items[o.id] || [];
  const st = o.status === 'cancelled' ? 'İptal edildi' : (STEPS.find(x => x[0] === o.status) || [0, o.status])[1];
  const addr = [a.address_line1, a.district, a.city].filter(Boolean).join(', ');
  return `<div class="ocard${o.status === 'pending' ? ' fresh' : ''}"><b>#${esc(String(o.id).slice(0, 6).toUpperCase())}</b> <span class="badge">${esc(st)}</span>
<p class="info">${esc(new Date(o.created_at).toLocaleString('tr-TR'))} · Kapıda ödeme · <b>${tl(o.total_amount)}</b></p>
<ul class="pit">${its.map(i => `<li>${esc(i.quantity)}× ${esc(i.item_name)}</li>`).join('') || '<li>…</li>'}</ul>
<p class="info">📍 ${esc(addr)}${a.postal_code ? ' · ' + esc(a.postal_code) : ''}</p>
${a.phone ? `<p class="info">📞 <a href="tel:${esc(a.phone)}">${esc(a.phone)}</a></p>` : ''}
${a.delivery_instructions ? `<p class="info">📝 ${esc(a.delivery_instructions)}</p>` : ''}
${o.coupon_code ? `<p class="info">🏷️ Kupon: ${esc(o.coupon_code)} (−${tl(o.discount_amount || 0)})</p>` : ''}
${(NEXT[o.status] || []).length ? `<div class="prow">${NEXT[o.status].map(([to, l], i) => `<button class="${i ? 'ghost' : 'go'}" data-pst="${esc(o.id)}" data-to="${to}">${l}</button>`).join('')}</div>` : ''}</div>`;
}
function renderPanel() {
  const t = $('#ptabs'), b = $('#pbody'); if (!t || !b) return;
  const g = k => pnl.orders.filter(o => pgrp(o.status) === k);
  t.innerHTML = PTABS.map(([k, l]) => `<button data-ptab="${k}" class="${pnl.tab === k ? 'on' : ''}">${l}${k !== 'menu' && k !== 'done' && g(k).length ? ` <i>${g(k).length}</i>` : ''}</button>`).join('');
  if (pnl.tab === 'menu') {
    b.innerHTML = pnl.menu === null ? '<p class="note">Menü yükleniyor…</p>' : pnl.menu.length ? pnl.menu.map(m => `<div class="pmi"><span><b>${esc(m.name)}</b><br><span class="info">${tl(m.price)}</span></span><button class="${m.is_available ? '' : 'off'}" data-pitem="${esc(m.id)}">${m.is_available ? 'Satışta' : 'Tükendi'}</button></div>`).join('') : '<div class="empty">Menüde ürün yok.</div>';
    return;
  }
  const list = g(pnl.tab).slice(0, pnl.tab === 'done' ? 20 : 60);
  b.innerHTML = list.length ? list.map(pOrderCard).join('') : '<div class="empty">Bu bölümde sipariş yok.</div>';
}
async function pollPanel() {
  const rid = pnl.rid;
  try {
    const rows = await api('orders?select=*&restaurant_id=eq.' + encodeURIComponent(rid) + '&order=created_at.desc&limit=60');
    if (rid !== pnl.rid || !$('#pnl')) return;
    const need = rows.filter(o => !(o.id in pnl.items)).map(o => o.id);
    if (need.length) {
      const its = await api('order_items?select=*&order_id=in.(' + need.join(',') + ')');
      need.forEach(id => { pnl.items[id] = []; });
      its.forEach(i => { if (pnl.items[i.order_id]) pnl.items[i.order_id].push(i); });
    }
    const pend = new Set(rows.filter(o => o.status === 'pending').map(o => o.id));
    if (pnl.seen && [...pend].some(id => !pnl.seen.has(id))) {
      beep(); toast('🔔 Yeni sipariş geldi!');
      const old = document.title; document.title = '🔔 Yeni sipariş!'; setTimeout(() => { document.title = old; }, 8000);
    }
    pnl.seen = pend; pnl.orders = rows; renderPanel();
  } catch (e) { const b = $('#pbody'); if (b && !pnl.orders.length) b.innerHTML = `<p class="err">Siparişler alınamadı (${esc(e.message)})</p>`; }
}
async function panelStatus(id, to) {
  if (to === 'cancelled' && !confirm('Siparişi iptal etmek istiyor musun?')) return;
  try {
    await fresh();
    const res = await fetch(SB_URL + '/rest/v1/rpc/set_order_status', { method: 'POST', headers: hdr(), body: JSON.stringify({ p_order_id: id, p_status: to }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.message || 'Durum değiştirilemedi');
    const o = pnl.orders.find(x => x.id === id); if (o) o.status = to;
    renderPanel(); toast('Güncellendi ✓');
  } catch (e) { toast(e.message); }
}
async function panelOpen() {
  const r = rests[pnl.rid], nv = r.is_open === false;
  try { await patchRow('restaurants?id=eq.' + encodeURIComponent(r.id), { is_open: nv }); r.is_open = nv; drawPanel(); renderPanel(); toast(nv ? 'Restoran açıldı' : 'Restoran kapatıldı'); }
  catch (e) { toast(e.message); }
}
function panelSound() {
  pnl.sound = !pnl.sound;
  if (pnl.sound) { try { pnl.ctx = pnl.ctx || new (window.AudioContext || window.webkitAudioContext)(); pnl.ctx.resume(); } catch (e) {} beep(); }
  drawPanel(); renderPanel();
}
async function panelTab(k) {
  pnl.tab = k; renderPanel();
  if (k === 'menu' && pnl.menu === null) {
    try { pnl.menu = await api('menu_items?select=id,name,price,is_available&restaurant_id=eq.' + encodeURIComponent(pnl.rid) + '&order=name'); } catch (e) { pnl.menu = []; toast(e.message); }
    renderPanel();
  }
}
async function panelItem(id) {
  const m = (pnl.menu || []).find(x => x.id === id); if (!m) return;
  try { await patchRow('menu_items?id=eq.' + encodeURIComponent(id), { is_available: !m.is_available }); m.is_available = !m.is_available; renderPanel(); toast(m.is_available ? 'Satışa açıldı' : 'Tükendi olarak işaretlendi'); }
  catch (e) { toast(e.message); }
}

document.addEventListener('click', e => {
  if (e.target.id === 'overlay') return closeCart();
  const fv = e.target.closest('[data-fav]');
  if (fv) return toggleFav(fv.dataset.fav);
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if ('panel' in d) return panelView();
  if ('popen' in d) return panelOpen();
  if ('psound' in d) return panelSound();
  if (d.pst) return panelStatus(d.pst, d.to);
  if (d.ptab) return panelTab(d.ptab);
  if (d.pitem) return panelItem(d.pitem);
  if ('loc' in d) return openLoc();
  if ('locsave' in d) return saveLoc();
  if (d.page) return showPage(d.page);
  if ('pageSend' in d) return sendPage(d.pageSend);
  if (d.tab) return tabView(d.tab);
  if ('saveaddr' in d) return saveAddr();
  if ('wa' in d) return openWA(d.wa);
  if ('coupon' in d) return applyCoupon();
  if (d.rv) return sendReview(d.rv, d.rest);
  if ('home' in d) { closeCart(); return home(); }
  if ('opencart' in d) return openCart();
  if ('closecart' in d) return closeCart();
  if (d.cat) { cat = d.cat; return fillHome(); }
  if (d.sort) { sortMode = d.sort; return fillHome(); }
  if ('onlyopen' in d) { onlyOpen = !onlyOpen; return fillHome(); }
  if ('menu' in d) return current ? draw() : (cart.rid ? openRest(cart.rid) : home());
  if ('in' in d) return authView('login');
  if ('out' in d) { clearInterval(pnl.timer); signOut(); who(); return current ? draw() : home(); }
  if (d.mode) return authView(d.mode);
  if (d.submit) return doAuth(d.submit);
  if ('verify' in d) return verifyCode();
  if ('resend' in d) return resendCode();
  if ('place' in d) return place();
  if (d.r) return openRest(d.r);
  if (d.add) return add(d.add);
  if (d.sub) return change(d.sub, -1);
  if (d.inc) return change(d.inc, 1);
  if (d.dec) return change(d.dec, -1);
  if ('go' in d) { closeCart(); return sess ? checkout() : authView('login'); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCart();
  if (e.key === 'Enter' && e.target.id === 'cd') { e.preventDefault(); verifyCode(); return; }
  if (e.key === 'Enter' && (e.target.id === 'em' || e.target.id === 'pw')) { e.preventDefault(); const b = document.querySelector('[data-submit]'); if (b) doAuth(b.dataset.submit); }
});

(async () => {
  if (sess && sess.exp < Date.now()) {
    try { save(toSess(await auth('token?grant_type=refresh_token', { refresh_token: sess.refresh }))); } catch (e) { save(null); }
  }
  who();
  await home();
  if (cart.rid && loaded && !rests[cart.rid]) clearCart();
  updateCart();
})();
</script>
