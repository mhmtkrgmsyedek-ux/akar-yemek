<script>
const SB_URL = 'https://bspjvnxnofkhnocjwsjb.supabase.co';
const SB_KEY = 'sb_publishable_LYozx29A9SxRFBEXLkxftg_28peojyK';
if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location = window.self.location; } catch (e) {} }
const $ = s => document.querySelector(s);
const isId = v => typeof v === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);

const PAYS = { cash: 'Kapıda ödeme', card: 'Kredi kartı' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tl = n => (Number(n) || 0).toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';

/* ---------- oturum ---------- */
let sess = null;
try { sess = JSON.parse(localStorage.getItem('sess') || 'null'); } catch (e) {}
const save = s => { sess = s; try { s ? localStorage.setItem('sess', JSON.stringify(s)) : localStorage.removeItem('sess'); } catch (e) {} };
const hdr = () => ({ apikey: SB_KEY, 'Content-Type': 'application/json', ...(sess ? { Authorization: 'Bearer ' + sess.token } : {}) });
const authMsg = m => {
  m = String(m || '');
  if (/invalid login|invalid_credentials/i.test(m)) return 'E-posta veya şifre hatalı.';
  if (/not confirmed/i.test(m)) return 'E-postan henüz doğrulanmamış.';
  if (/expired|invalid.*(token|otp)|token.*invalid|otp/i.test(m)) return 'Kod hatalı ya da süresi dolmuş. Yeni kod isteyebilirsin.';
  if (/already registered|already been registered/i.test(m)) return 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
  if (/password.*(short|least|characters)|weak/i.test(m)) return 'Şifre en az 8 karakter olmalı ve hem harf hem rakam içermeli.';
  if (/valid email|invalid.*email|unable to validate email/i.test(m)) return 'Geçerli bir e-posta adresi yaz.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Çok fazla deneme yapıldı. Bir dakika bekleyip tekrar dene.';
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.';
  return m || 'İşlem başarısız.';
};
const authReq = async (path, body) => {
  const r = await fetch(SB_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'İşlem başarısız');
  return j;
};
const toSess = j => ({ token: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000, uid: j.user.id, email: j.user.email });
async function fresh() {
  if (sess && sess.exp < Date.now()) {
    try { save(toSess(await authReq('token?grant_type=refresh_token', { refresh_token: sess.refresh }))); } catch (e) { save(null); }
  }
}
const api = async path => {
  await fresh();
  if (!sess) { showLogin(); throw new Error('Oturum kapandı'); }
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: hdr() });
  if (r.status === 401) { save(null); showLogin(); throw new Error('Oturum kapandı'); }
  if (!r.ok) throw new Error('Sunucu hatası: ' + r.status);
  return r.json();
};
const patchRow = async (path, body) => {
  await fresh();
  const r = await fetch(SB_URL + '/rest/v1/' + path, { method: 'PATCH', headers: { ...hdr(), Prefer: 'return=minimal' }, body: JSON.stringify(body) });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || ('Sunucu hatası: ' + r.status)); }
};
async function signOut() {
  const t = sess && sess.token;
  save(null);
  if (t) { try { await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + t } }); } catch (e) {} }
}
function who() { $('#who').innerHTML = sess ? `<span>${esc(sess.email)}</span><button class="ghost" data-out>Çıkış</button>` : ''; }

/* ---------- giriş ---------- */
function showLogin() {
  clearInterval(pnl.timer); who();
  $('#app').innerHTML = `<div class="wrap"><div class="login card"><h2 class="title">Kurye girişi</h2><p class="info">Akar Yemek kurye hesabınla giriş yap.</p>
<label for="em">E-posta</label><input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false">
<label for="pw">Şifre</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="none">
<p id="aerr" class="err" hidden style="margin:12px 0 0"></p>
<button class="go" data-login>Giriş yap</button>
<button class="sw" data-rsignup>Kurye olmak mı istiyorsun? Kayıt ol</button></div></div>`;
}
let authBusy = false, authFails = 0, authLock = 0;
async function doLogin() {
  if (authBusy) return;
  const email = $('#em').value.trim().toLowerCase(), password = $('#pw').value, el = $('#aerr'), btn = $('[data-login]');
  el.hidden = false;
  if (!email || !password) { el.textContent = 'E-posta ve şifreyi yaz.'; return; }
  if (Date.now() < authLock) { el.textContent = 'Çok fazla deneme yaptın. ' + Math.ceil((authLock - Date.now()) / 1000) + ' saniye sonra tekrar dene.'; return; }
  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try { save(toSess(await authReq('token?grant_type=password', { email, password }))); authFails = 0; who(); await start(); }
  catch (e) { if (++authFails >= 5) { authLock = Date.now() + 60000; authFails = 0; } el.hidden = false; el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-login]')) $('[data-login]').disabled = false; }
}


/* ---------- restoran kaydı ---------- */
let codeEmail = '', resendAt = 0;
function signupView() {
  clearInterval(pnl.timer); who();
  $('#app').innerHTML = `<div class="wrap"><div class="wide card"><h2 class="title">Kurye olarak kayıt ol</h2><p class="info">Önce hesabını oluştur, sonra adını ve telefonunu gireceksin.</p>

<label for="spw">Şifre (en az 8 karakter, harf ve rakam)</label><input id="spw" type="password" autocomplete="new-password" autocapitalize="none">
<p id="serr" class="err" hidden style="margin:12px 0 0"></p>
<button class="go" data-rsignupgo>Kayıt ol</button>
<button class="sw" data-rlogin>Hesabın var mı? Giriş yap</button></div></div>`;
  scrollTo(0, 0);
}
async function doSignup() {
  if (authBusy) return;
  const email = $('#sem').value.trim().toLowerCase(), password = $('#spw').value, el = $('#serr'), btn = $('[data-rsignupgo]');
  el.hidden = false;
  if (!email || !password) { el.textContent = 'E-posta ve şifreyi yaz.'; return; }
  if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) { el.textContent = 'Şifre en az 8 karakter olmalı ve hem harf hem rakam içermeli.'; return; }
  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try {
    const j = await authReq('signup', { email, password });
    if (!j.access_token) {
      if (j.user && Array.isArray(j.user.identities) && !j.user.identities.length) { el.textContent = 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.'; return; }
      return codeView(email);
    }
    save(toSess(j)); who(); await start();
  } catch (e) { el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-rsignupgo]')) $('[data-rsignupgo]').disabled = false; }
}
function codeView(email, note) {
  codeEmail = email;
  $('#app').innerHTML = `<div class="wrap"><div class="wide card"><h2 class="title">E-postanı doğrula</h2>
<p class="info">${esc(note || 'Hesabını doğrulamak için e-postana bir kod gönderdik.')}</p><p class="info"><b>${esc(email)}</b> adresine gelen kodu yaz. Gelmediyse spam klasörüne de bak.</p>
<label for="cd">Doğrulama kodu</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Örn. 123456">
<p id="cderr" class="err" hidden style="margin:12px 0 0"></p>
<button class="go" data-verify>Doğrula</button>
<button class="sw" data-resend>Kodu tekrar gönder</button></div></div>`;
  scrollTo(0, 0);
  const i = $('#cd'); if (i) i.focus();
}
async function verifyCode() {
  if (authBusy) return;
  const el = $('#cderr'), btn = $('[data-verify]');
  const token = ($('#cd').value || '').replace(/\s+/g, '');
  el.hidden = false;
  if (!/^\d{4,10}$/.test(token)) { el.textContent = 'E-postana gelen kodu rakamlarla yaz.'; return; }
  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try {
    const j = await authReq('verify', { type: 'signup', email: codeEmail, token });
    if (!j.access_token) throw new Error('Doğrulama tamamlanamadı. Tekrar dene.');
    save(toSess(j)); who(); await start();
  } catch (e) { el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-verify]')) $('[data-verify]').disabled = false; }
}
async function resendCode() {
  const el = $('#cderr'); el.hidden = false;
  const wait = Math.ceil((resendAt - Date.now()) / 1000);
  if (wait > 0) { el.textContent = 'Yeni kod için ' + wait + ' saniye bekle.'; return; }
  el.textContent = 'Gönderiliyor…';
  try { await authReq('resend', { type: 'signup', email: codeEmail }); resendAt = Date.now() + 60000; el.textContent = 'Yeni kod gönderildi. Gelen kutunu ve spam klasörünü kontrol et.'; }
  catch (e) { el.textContent = authMsg(e.message); }
}

let pnl = { timer: null, tab: 'open', me: null, open: [], mine: [] };
const CS = { assigned: 'Restorana git', picked_up: 'Müşteriye götür', delivered: 'Teslim edildi' };
async function rpc(fn, body) {
  await fresh(); const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: hdr(), body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.message || 'İşlem başarısız'); return j;
}
async function start() {
  $('#app').innerHTML = '<div class="wrap"><p class="info">Yükleniyor…</p></div>'; clearInterval(pnl.timer);
  try { const r = await api('courier_profiles?select=*&id=eq.' + encodeURIComponent(sess.uid)); pnl.me = r[0] || null; }
  catch (e) { if (sess) $('#app').innerHTML = `<div class="wrap"><p class="err">Veriler alınamadı (${esc(e.message)})</p></div>`; return; }
  if (!pnl.me) return regView();
  if (pnl.me.status !== 'approved') return waitView();
  draw(); await poll(); pnl.timer = setInterval(() => { if (!$('#cur')) return clearInterval(pnl.timer); poll(); }, 10000);
}
function regView() {
  $('#app').innerHTML = `<div class="wrap"><div class="wide card"><h2 class="title">Kurye başvurusu</h2><p class="info">Adını ve telefonunu yaz. Başvurun Akar Yemek tarafından onaylanınca iş alabilirsin.</p>
<label for="kn">Ad soyad</label><input id="kn" maxlength="60" autocomplete="name"><label for="kp">Telefon</label><input id="kp" type="tel" inputmode="tel" maxlength="20" autocomplete="tel">
<button class="go" data-kreg>Başvuruyu gönder</button></div></div>`;
}
async function register() {
  const n = ($('#kn').value || '').trim(), p = ($('#kp').value || '').trim();
  if (n.length < 3) return toast('Adını soyadını yaz'); if (!/^[\d\s+()-]{7,20}$/.test(p)) return toast('Geçerli bir telefon yaz');
  try { await rpc('courier_register', { p_name: n, p_phone: p }); await start(); } catch (e) { toast(e.message); }
}
function waitView() {
  const sus = pnl.me.status === 'suspended';
  $('#app').innerHTML = `<div class="wrap"><div class="wide card"><h2 class="title">${sus ? 'Hesabın askıda' : 'Başvurun alındı'}</h2><p class="info">${sus ? 'Hesabın şu an kullanıma kapalı. Akar Yemek ile iletişime geç.' : '<b>' + esc(pnl.me.full_name) + '</b> için başvurun onay bekliyor. Onaylanınca iş alabilirsin.'}</p><button class="go" data-kref>Onay durumunu kontrol et</button></div></div>`;
}
const ageMin = t => t ? Math.floor((Date.now() - new Date(t).getTime()) / 6e4) : 0;
const mapUrl = a => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a || '');
function draw() { const on = !!pnl.me.is_online; $('#app').innerHTML = `<div class="wrap" id="cur"><h2 class="title">Merhaba, ${esc(pnl.me.full_name)}</h2>${'is_online' in pnl.me ? `<button class="${on ? 'gr' : 'ghost'} big" data-konl>${on ? '🟢 Çevrimiçisin · çevrimdışı olmak için dokun' : '⚪ Çevrimdışısın · iş almak için çevrimiçi ol'}</button>` : ''}<div id="cbody"></div><div class="ptabs" id="ctabs"></div></div>`; renderC(); }
async function poll() {
  const sel = 'courier_requests?select=*,restaurants(name,address,phone)';
  try {
    [pnl.open, pnl.mine] = await Promise.all([rpc('courier_open_jobs', {}).then(rs => rs.map(j => ({ ...j, status: 'open', customer_phone: '', restaurants: { name: j.restaurant_name, address: j.restaurant_address } }))), api(sel + '&courier_id=eq.' + encodeURIComponent(sess.uid) + '&order=created_at.desc&limit=200')]);
    const ids = new Set(pnl.open.map(x => x.id)); if (pnl._seen && [...ids].some(i => !pnl._seen.has(i)) && pnl.me.is_online !== false) { toast('🔔 Yeni iş var'); if (navigator.vibrate) navigator.vibrate(200); } pnl._seen = ids;
    renderC();
  } catch (e) {}
}
function card(c) {
  const act = c.status === 'open' ? ['kaccept', 'Kabul et'] : c.status === 'assigned' ? ['kpick', 'Teslim aldım'] : c.status === 'picked_up' ? ['kdone', 'Teslim ettim'] : null, mine = c.status !== 'open', r = c.restaurants || {}, m = c.status === 'open' ? ageMin(c.created_at) : 0;
  return `<div class="ocard${c.status === 'open' ? ' fresh' : ''}"><b>${esc(r.name || 'Restoran')}</b> <span class="badge">${c.status === 'open' ? 'Yeni iş' : esc(CS[c.status] || c.status)}</span>${m ? ` <span class="info">⏱ ${m} dk önce</span>` : ''}
<p class="info">🏪 ${esc(r.address || '')}${mine && r.phone ? ` · <a href="tel:${esc(telOf(r.phone))}">${esc(r.phone)}</a>` : ''}</p>
<p class="info">📍 ${esc(c.address)}${mine ? `<br>👤 ${esc(c.customer_name || 'Müşteri')} · <a href="tel:${esc(telOf(c.customer_phone))}">${esc(c.customer_phone)}</a>` : ''}</p>
${Number(c.collect_amount) ? `<p class="info">💵 Müşteriden tahsil edilecek: <b>${tl(c.collect_amount)}</b></p>` : ''}${c.note ? `<p class="info">📝 ${esc(c.note)}</p>` : ''}
<p class="info">Kazancın: <b>${tl(c.fee)}</b></p>${act ? `<div class="prow">${r.address ? `<a class="ghost" target="_blank" rel="noopener noreferrer" href="${mapUrl(r.address)}">🧭 Restorana git</a>` : ''}${mine && c.address ? `<a class="ghost" target="_blank" rel="noopener noreferrer" href="${mapUrl(c.address)}">🧭 Müşteriye git</a>` : ''}</div><button class="go big" data-${act[0]}="${esc(c.id)}">${act[1]}</button>` : ''}</div>`;
}
function stats() {
  const n = new Date(), t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()), w0 = new Date(t0 - ((n.getDay() + 6) % 7) * 864e5), m0 = new Date(n.getFullYear(), n.getMonth(), 1), dl = pnl.mine.filter(c => c.status === 'delivered'), at = c => new Date(c.delivered_at || c.created_at), f = from => dl.filter(c => at(c) >= from), sm = l => l.reduce((a, c) => a + Number(c.fee || 0), 0), tt = dl.filter(c => c.accepted_at && c.delivered_at).map(c => (new Date(c.delivered_at) - new Date(c.accepted_at)) / 6e4);
  return { d: sm(f(t0)), dn: f(t0).length, w: sm(f(w0)), wn: f(w0).length, m: sm(f(m0)), mn: f(m0).length, avg: tt.length ? Math.round(tt.reduce((a, v) => a + v, 0) / tt.length) : null, dl };
}
const geo = { w: null, last: 0, paused: false, asked: false, err: '' };
function geoSync(act) {
  if (!('geolocation' in navigator)) return;
  const need = act.length > 0;
  if (need && !geo.asked) { geo.asked = true; if (!confirm('Teslimat boyunca konumun yönetimle paylaşılacak; ürünü teslim aldıktan sonra müşteri de kuryeyi haritada görebilecek. İş bitince paylaşım otomatik durur. Onaylıyor musun?')) geo.paused = true; }
  if (need && !geo.paused && geo.w === null) geo.w = navigator.geolocation.watchPosition(p => { const n = Date.now(); if (n - geo.last < 15000) return; geo.last = n; geo.err = ''; rpc('courier_report_location', { p_lat: p.coords.latitude, p_lng: p.coords.longitude, p_acc: p.coords.accuracy }).catch(() => {}); }, e => { const m = e.code === 1 ? 'Konum izni verilmedi' : 'Konum alınamıyor'; if (geo.err !== m) { geo.err = m; renderC(); } }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
  if ((!need || geo.paused) && geo.w !== null) { navigator.geolocation.clearWatch(geo.w); geo.w = null; geo.last = 0; rpc('courier_clear_location', {}).catch(() => {}); }
}
const geoBanner = act => act.length && 'geolocation' in navigator ? `<div class="ann" style="margin:10px 0"><div><b>📡 ${geo.paused ? 'Konum paylaşımı durduruldu' : geo.err || 'Konumun paylaşılıyor'}</b><span>Teslimat boyunca yönetimle, teslim aldıktan sonra müşteriyle paylaşılır. İş bitince otomatik durur. Uygulama açık ve ekran uyanık olmalı.</span></div><button class="ghost" data-geopause style="font-size:13px;padding:8px 10px">${geo.paused ? 'Başlat' : 'Durdur'}</button></div>` : '';
document.addEventListener('click', e => { if (!e.target.closest('[data-geopause]')) return; geo.paused = !geo.paused; geo.asked = true; renderC(); });
function renderC() {
  const t = $('#ctabs'), b = $('#cbody'); if (!t || !b) return;
  const act = pnl.mine.filter(c => c.status === 'assigned' || c.status === 'picked_up'), S = stats(), off = 'is_online' in pnl.me && !pnl.me.is_online;
  geoSync(act);
  t.innerHTML = [['open', '🔎 Açık işler', pnl.open.length], ['mine', '🛵 İşlerim', act.length], ['earn', '💰 Kazanç', 0]].map(([k, n, c]) => `<button data-ctab="${k}" class="${pnl.tab === k ? 'on' : ''}">${n}${c ? ` <i>${c}</i>` : ''}</button>`).join('');
  if (pnl.tab === 'earn') { b.innerHTML = `<div class="kpi"><div><span>Bugün</span><b>${tl(S.d)}</b><small>${S.dn} teslimat</small></div><div><span>Bu hafta</span><b>${tl(S.w)}</b><small>${S.wn} teslimat</small></div><div><span>Bu ay</span><b>${tl(S.m)}</b><small>${S.mn} teslimat</small></div><div><span>Ort. teslimat süresi</span><b>${S.avg == null ? '–' : S.avg + ' dk'}</b><small>kabulden teslime</small></div></div><p class="hint">Son 200 işe göre hesaplanır.</p><h3 style="margin:16px 0 6px">Son teslimatlar</h3>` + (S.dl.slice(0, 15).map(c => `<div class="pmi"><span><b>${esc((c.restaurants || {}).name || 'Restoran')}</b><br><span class="info">${esc(new Date(c.delivered_at || c.created_at).toLocaleString('tr-TR'))}</span></span><b>${tl(c.fee)}</b></div>`).join('') || '<div class="empty">Henüz teslimat yok.</div>'); return; }
  const top = geoBanner(act) + `<div class="kpi"><div><span>Bugün kazanç</span><b>${tl(S.d)}</b></div><div><span>Aktif iş</span><b>${act.length}</b></div></div>`;
  if (pnl.tab === 'open' && off) { b.innerHTML = top + '<div class="empty">⚪ Çevrimdışısın. Yeni iş görmek için yukarıdan çevrimiçi ol.</div>'; return; }
  const list = pnl.tab === 'open' ? pnl.open : [...act, ...pnl.mine.filter(c => !act.includes(c))];
  b.innerHTML = top + (list.length ? list.map(card).join('') : `<div class="empty">${pnl.tab === 'open' ? 'Şu an açık iş yok.' : 'Henüz işin yok.'}</div>`);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if ('rsignup' in d) return signupView(); if ('rlogin' in d) return showLogin(); if ('rsignupgo' in d) return doSignup(); if ('verify' in d) return verifyCode(); if ('resend' in d) return resendCode(); if ('login' in d) return doLogin();
  if ('out' in d) { signOut(); clearInterval(pnl.timer); pnl.me = null; return showLogin(); }
  if ('kreg' in d) return register(); if ('kref' in d) return start();
  if ('konl' in d) { try { await rpc('courier_set_online', { p_online: !pnl.me.is_online }); pnl.me.is_online = !pnl.me.is_online; draw(); toast(pnl.me.is_online ? 'Çevrimiçisin' : 'Çevrimdışısın'); } catch (x) { toast(x.message); } return; }
  if (d.ctab) { pnl.tab = d.ctab; return renderC(); }
  const m = { kaccept: ['courier_accept', 'Kabul edildi ✓'], kpick: ['courier_update', 'Teslim alındı ✓', 'picked_up'], kdone: ['courier_update', 'Teslim edildi ✓', 'delivered'] };
  for (const k in m) if (d[k]) { try { await rpc(m[k][0], m[k][2] ? { p_id: d[k], p_status: m[k][2] } : { p_id: d[k] }); toast(m[k][1]); if (k === 'kaccept') pnl.tab = 'mine'; } catch (x) { toast(x.message); } return poll(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'em' || e.target.id === 'pw')) { e.preventDefault(); doLogin(); }
  if (e.key === 'Enter' && (e.target.id === 'sem' || e.target.id === 'spw')) { e.preventDefault(); doSignup(); }
  if (e.key === 'Enter' && e.target.id === 'cd') { e.preventDefault(); verifyCode(); }
});
(async () => { await fresh(); who(); sess ? start() : showLogin(); })();
(async function () { try { const L = await api('announcements?select=*&target=in.(all,couriers)&order=created_at.desc&limit=3'); let hid = []; try { hid = JSON.parse(sessionStorage.getItem('annhid') || '[]'); } catch (e) {} const el = document.getElementById('annbar'); if (!el) return; el.innerHTML = L.filter(x => !hid.includes(x.id)).map(x => `<div class="ann"><div><b>${esc(x.title)}</b>${x.body ? `<span>${esc(x.body)}</span>` : ''}</div><button data-annx="${esc(x.id)}" aria-label="Kapat">✕</button></div>`).join(''); } catch (e) {} })();
document.addEventListener('click', e => { const b = e.target.closest('[data-annx]'); if (!b) return; try { const h = JSON.parse(sessionStorage.getItem('annhid') || '[]'); h.push(b.dataset.annx); sessionStorage.setItem('annhid', JSON.stringify(h)); } catch (x) {} b.closest('.ann').remove(); });
</script>
