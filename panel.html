button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

.go{background:var(--red);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px}

.title{font-size:24px;letter-spacing:-.5px;margin:6px 0 4px}
.info{color:var(--muted);margin:0 0 8px}
.err{color:var(--err);background:#fff;border:1px solid var(--err);padding:12px;border-radius:12px}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
label{display:block;font-weight:700;margin:14px 0 5px;font-size:14px}
.login{max-width:400px;margin:40px auto}

.ptabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.ptabs i{font-style:normal;background:#fff;color:var(--red);border-radius:99px;padding:1px 7px;margin-left:4px;font-size:12px;font-weight:800}
.ocard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.ocard.fresh{border-color:var(--red);box-shadow:0 0 0 3px #e53d3222}
.pit{margin:8px 0;padding-left:20px;font-weight:650}
.pmi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.pmi button{border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-weight:750;font-size:13px;white-space:nowrap;background:#fff}
.pmi button.off{background:var(--ink);color:#fff;border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
a{color:var(--red-d)}
.sw{color:var(--red);font-weight:700;margin-top:12px;padding:6px 0;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.wide{max-width:560px;margin:24px auto}

<script>

const save = s => { sess = s; try { s ? localStorage.setItem('sess', JSON.stringify(s)) : localStorage.removeItem('sess'); } catch (e) {} };
const hdr = () => ({ apikey: SB_KEY, 'Content-Type': 'application/json', ...(sess ? { Authorization: 'Bearer ' + sess.token } : {}) });
const authMsg = m => {
  m = String(m || '');
  if (/invalid login|invalid_credentials/i.test(m)) return 'E-posta veya şifre hatalı.';
  if (/not confirmed/i.test(m)) return 'E-postan henüz doğrulanmamış.';
  if (/expired|invalid.*(token|otp)|token.*invalid|otp/i.test(m)) return 'Kod hatalı ya da süresi dolmuş. Yeni kod isteyebilirsin.';
  if (/already registered|already been registered/i.test(m)) return 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
  if (/password.*(short|least|characters)|weak/i.test(m)) return 'Şifre en az 8 karakter olmalı ve hem harf hem rakam içermeli.';
  if (/valid email|invalid.*email|unable to validate email/i.test(m)) return 'Geçerli bir e-posta adresi yaz.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Çok fazla deneme yapıldı. Bir dakika bekleyip tekrar dene.';
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.';
  return m || 'İşlem başarısız.';
};
const authReq = async (path, body) => {
  const r = await fetch(SB_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'İşlem başarısız');
  return j;
};
const toSess = j => ({ token: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000, uid: j.user.id, email: j.user.email });
async function fresh() {
  if (sess && sess.exp < Date.now()) {
    try { save(toSess(await authReq('token?grant_type=refresh_token', { refresh_token: sess.refresh }))); } catch (e) { save(null); }
  }
}
const api = async path => {
  await fresh();
  if (!sess) { showLogin(); throw new Error('Oturum kapandı'); }
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: hdr() });
  if (r.status === 401) { save(null); showLogin(); throw new Error('Oturum kapandı'); }
  if (!r.ok) throw new Error('Sunucu hatası: ' + r.status);
  return r.json();
};
const patchRow = async (path, body) => {
  await fresh();
  const r = await fetch(SB_URL + '/rest/v1/' + path, { method: 'PATCH', headers: { ...hdr(), Prefer: 'return=minimal' }, body: JSON.stringify(body) });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || ('Sunucu hatası: ' + r.status)); }
};
async function signOut() {
  const t = sess && sess.token;
  save(null);
  if (t) { try { await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + t } }); } catch (e) {} }
}
function who() { $('#who').innerHTML = sess ? `<span>${esc(sess.email)}</span><button class="ghost" data-out>Çıkış</button>` : ''; }

/* ---------- giriş ---------- */
function showLogin() {

<button class="sw" data-rsignup>Restoranın mı var? Restoran olarak kayıt ol</button></div></div>`;
}
let authBusy = false, authFails = 0, authLock = 0;
async function doLogin() {
  if (authBusy) return;
  const email = $('#em').value.trim().toLowerCase(), password = $('#pw').value, el = $('#aerr'), btn = $('[data-login]');
  el.hidden = false;
  if (!email || !password) { el.textContent = 'E-posta ve şifreyi yaz.'; return; }
  if (Date.now() < authLock) { el.textContent = 'Çok fazla deneme yaptın. ' + Math.ceil((authLock - Date.now()) / 1000) + ' saniye sonra tekrar dene.'; return; }
  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try { save(toSess(await authReq('token?grant_type=password', { email, password }))); authFails = 0; who(); await start(); }
  catch (e) { if (++authFails >= 5) { authLock = Date.now() + 60000; authFails = 0; } el.hidden = false; el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-login]')) $('[data-login]').disabled = false; }
}

async function doSignup() {
  if (authBusy) return;
  const email = $('#sem').value.trim().toLowerCase(), password = $('#spw').value, el = $('#serr'), btn = $('[data-rsignupgo]');
  el.hidden = false;
  if (!email || !password) { el.textContent = 'E-posta ve şifreyi yaz.'; return; }

  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try {
    const j = await authReq('signup', { email, password });
    if (!j.access_token) {
      if (j.user && Array.isArray(j.user.identities) && !j.user.identities.length) { el.textContent = 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.'; return; }
      return codeView(email);
    }
    save(toSess(j)); who(); await start();
  } catch (e) { el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-rsignupgo]')) $('[data-rsignupgo]').disabled = false; }
}
function codeView(email, note) {

<p class="info">${esc(note || 'Hesabını doğrulamak için e-postana bir kod gönderdik.')}</p><p class="info"><b>${esc(email)}</b> adresine gelen kodu yaz. Gelmediyse spam klasörüne de bak.</p>

async function verifyCode() {
  if (authBusy) return;
  const el = $('#cderr'), btn = $('[data-verify]');
  const token = ($('#cd').value || '').replace(/\s+/g, '');
  el.hidden = false;
  if (!/^\d{4,10}$/.test(token)) { el.textContent = 'E-postana gelen kodu rakamlarla yaz.'; return; }
  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try {
    const j = await authReq('verify', { type: 'signup', email: codeEmail, token });
    if (!j.access_token) throw new Error('Doğrulama tamamlanamadı. Tekrar dene.');
    save(toSess(j)); who(); await start();
  } catch (e) { el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-verify]')) $('[data-verify]').disabled = false; }
}
async function resendCode() {
  const el = $('#cderr'); el.hidden = false;
  const wait = Math.ceil((resendAt - Date.now()) / 1000);
  if (wait > 0) { el.textContent = 'Yeni kod için ' + wait + ' saniye bekle.'; return; }
  el.textContent = 'Gönderiliyor…';
  try { await authReq('resend', { type: 'signup', email: codeEmail }); resendAt = Date.now() + 60000; el.textContent = 'Yeni kod gönderildi. Gelen kutunu ve spam klasörünü kontrol et.'; }
  catch (e) { el.textContent = authMsg(e.message); }
}
const postRow = async (path, body) => {
  await fresh();
  if (!sess) { showLogin(); throw new Error('Oturum kapandı'); }
  const r = await fetch(SB_URL + '/rest/v1/' + path, { method: 'POST', headers: { ...hdr(), Prefer: 'return=minimal' }, body: JSON.stringify(body) });
  if (r.status === 401) { save(null); showLogin(); throw new Error('Oturum kapandı'); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || ('Sunucu hatası: ' + r.status)); }
};
async function registerView() {
  let cu = [];
  try { cu = await api('cuisines?select=id,name&order=sort_order'); } catch (e) {}
  if (!sess) return;
  $('#app').innerHTML = `<div class="wrap"><div class="wide card"><h2 class="title">Restoranını kaydet</h2><p class="info">Bilgilerini gir. Başvurun Akar Yemek tarafından onaylanınca restoranın sitede görünür ve siparişler bu panele düşer.</p>
<label for="rn">Restoran adı</label><input id="rn" maxlength="80" autocomplete="organization">
<label for="rc">Mutfak türü</label><select id="rc"><option value="">Seç</option>${cu.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>
<label for="rd">Kısa açıklama</label><input id="rd" maxlength="300" placeholder="Örn. Ev yapımı pasta ve tatlılar">

<button class="go" data-rsubmit>Başvuruyu gönder</button></div></div>`;

async function registerRest() {

  if (!/^[\d\s+()-]{7,20}$/.test(phone)) { el.textContent = 'Geçerli bir telefon numarası yaz.'; return; }

function pendingView(rs) {
  clearInterval(pnl.timer);
  $('#app').innerHTML = `<div class="wrap"><div class="wide card"><h2 class="title">Başvurun alındı</h2>
<p class="info"><b>${esc(rs[0].name)}</b> için başvurun onay bekliyor. Onaylanınca restoranın sitede görünür ve siparişler bu sayfaya düşer.</p>
<p class="info">Onay durumunu görmek için aşağıdaki düğmeyle sayfayı yenileyebilirsin.</p>
<button class="go" data-rrefresh>Onay durumunu kontrol et</button></div></div>`;
}

/* ---------- panel ---------- */
const STEPS = [['pending', 'Sipariş alındı'], ['accepted', 'Onaylandı'], ['preparing', 'Hazırlanıyor'], ['out_for_delivery', 'Yolda'], ['delivered', 'Teslim edildi']];
const NEXT = { pending: [['accepted', 'Onayla'], ['cancelled', 'Reddet']], accepted: [['preparing', 'Hazırlanmaya başla'], ['cancelled', 'İptal et']], preparing: [['out_for_delivery', 'Yola çıktı'], ['cancelled', 'İptal et']], out_for_delivery: [['delivered', 'Teslim edildi']] };
const PTABS = [['new', 'Yeni'], ['prep', 'Hazırlanıyor'], ['way', 'Yolda'], ['done', 'Bitenler'], ['menu', 'Menü']];
const pgrp = st => st === 'pending' || st === 'accepted' ? 'new' : st === 'preparing' ? 'prep' : st === 'out_for_delivery' ? 'way' : 'done';
let pnl = { rests: [], rid: null, tab: 'new', orders: [], items: {}, menu: null, seen: null, sound: false, ctx: null, timer: null, lastBeep: 0, wake: null };
const cur = () => pnl.rests.find(r => r.id === pnl.rid);

function beep() {
  if (!pnl.sound) return;
  try {
    const c = pnl.ctx || (pnl.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (c.state === 'suspended') c.resume();
    [0, .28, .56].forEach(t => {
      const o = c.createOscillator(), g = c.createGain(), at = c.currentTime + t;
      o.type = 'square'; o.frequency.value = 880; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.25, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + .22);
      o.start(at); o.stop(at + .24);
    });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (e) {}
}
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') pnl.wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('#pnl')) { keepAwake(); pollPanel(); } });

async function start() {
  $('#app').innerHTML = '<div class="wrap"><p class="info">Yükleniyor…</p></div>';
  try {
    pnl.rests = await api('restaurants?select=*&owner_id=eq.' + encodeURIComponent(sess.uid) + '&order=name');
  } catch (e) { if (sess) $('#app').innerHTML = `<div class="wrap"><p class="err">Veriler alınamadı (${esc(e.message)})</p></div>`; return; }
  const allRests = pnl.rests; pnl.rests = allRests.filter(r => r.is_active);
  if (!allRests.length) return registerView();
  if (!pnl.rests.length) return pendingView(allRests);
  if (!pnl.rid || !cur()) pnl.rid = pnl.rests[0].id;
  pnl.seen = null; pnl.tab = 'new'; pnl.orders = []; pnl.items = {}; pnl.menu = null;
  drawPanel(); renderPanel(); keepAwake();
  await pollPanel();
  clearInterval(pnl.timer);
  pnl.timer = setInterval(() => { if (!$('#pnl')) return clearInterval(pnl.timer); pollPanel(); }, 8000);
}
function drawPanel() {
  const r = cur(), open = r.is_open !== false;
  $('#app').innerHTML = `<div class="wrap" id="pnl">
${pnl.rests.length > 1 ? `<select id="prest">${pnl.rests.map(x => `<option value="${esc(x.id)}" ${x.id === pnl.rid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : `<h2 class="title">${esc(r.name)}</h2>`}
${pnl.sound ? '' : '<button class="soundbar" data-psound>🔕 Yeni sipariş sesi kapalı — açmak için dokun</button>'}
<div class="prow"><button class="${open ? 'ghost' : 'go'}" data-popen>${open ? '🟢 Açık · kapatmak için dokun' : '🔴 Kapalı · açmak için dokun'}</button>${pnl.sound ? '<button class="ghost" data-psound>🔔 Ses açık</button>' : ''}</div>
<div class="ptabs" id="ptabs"></div><div id="pbody"></div></div>`;
}
function orderCard(o) {
  const a = o.delivery_address || {}, its = pnl.items[o.id] || [];
  const st = o.status === 'cancelled' ? 'İptal edildi' : (STEPS.find(x => x[0] === o.status) || [0, o.status])[1];
  const addr = [a.address_line1, a.district, a.city].filter(Boolean).join(', ');
  return `<div class="ocard${o.status === 'pending' ? ' fresh' : ''}"><b>#${esc(String(o.id).slice(0, 6).toUpperCase())}</b> <span class="badge">${esc(st)}</span>
<p class="info">${esc(new Date(o.created_at).toLocaleString('tr-TR'))} · ${esc(PAYS[o.payment_method || o.payment] || 'Kapıda ödeme')} · <b>${tl(o.total_amount)}</b></p>
<ul class="pit">${its.map(i => `<li>${esc(i.quantity)}× ${esc(i.item_name)}</li>`).join('') || '<li>…</li>'}</ul>
<p class="info">📍 ${esc(addr)}${a.postal_code ? ' · ' + esc(a.postal_code) : ''}</p>
${a.phone ? `<p class="info">📞 <a href="tel:${esc(telOf(a.phone))}">${esc(a.phone)}</a></p>` : ''}
${a.delivery_instructions ? `<p class="info">📝 ${esc(a.delivery_instructions)}</p>` : ''}
${o.coupon_code ? `<p class="info">🏷️ Kupon: ${esc(o.coupon_code)} (−${tl(o.discount_amount || 0)})</p>` : ''}
${(NEXT[o.status] || []).length ? `<div class="prow">${NEXT[o.status].map(([to, l], i) => `<button class="${i ? 'ghost' : 'go'}" data-pst="${esc(o.id)}" data-to="${to}">${l}</button>`).join('')}</div>` : ''}</div>`;
}
function renderPanel() {
  const t = $('#ptabs'), b = $('#pbody'); if (!t || !b) return;
  const g = k => pnl.orders.filter(o => pgrp(o.status) === k);
  t.innerHTML = PTABS.map(([k, l]) => `<button data-ptab="${k}" class="${pnl.tab === k ? 'on' : ''}">${l}${k !== 'menu' && k !== 'done' && g(k).length ? ` <i>${g(k).length}</i>` : ''}</button>`).join('');
  if (pnl.tab === 'menu') {
    b.innerHTML = pnl.menu === null ? '<p class="info">Menü yükleniyor…</p>' : pnl.menu.length ? pnl.menu.map(m => `<div class="pmi"><span><b>${esc(m.name)}</b><br><span class="info">${tl(m.price)}</span></span><button class="${m.is_available ? '' : 'off'}" data-pitem="${esc(m.id)}">${m.is_available ? 'Satışta' : 'Tükendi'}</button></div>`).join('') : '<div class="empty">Menüde ürün yok.</div>';
    return;
  }
  const list = g(pnl.tab).slice(0, pnl.tab === 'done' ? 20 : 60);
  b.innerHTML = list.length ? list.map(orderCard).join('') : '<div class="empty">Bu bölümde sipariş yok.</div>';
}
async function pollPanel() {
  const rid = pnl.rid;
  try {
    const rows = await api('orders?select=*&restaurant_id=eq.' + encodeURIComponent(rid) + '&order=created_at.desc&limit=60');
    if (rid !== pnl.rid || !$('#pnl')) return;
    const need = rows.filter(o => isId(o.id) && !(o.id in pnl.items)).map(o => o.id);
    if (need.length) {
      const its = await api('order_items?select=*&order_id=in.(' + need.join(',') + ')');
      need.forEach(id => { pnl.items[id] = []; });
      its.forEach(i => { if (pnl.items[i.order_id]) pnl.items[i.order_id].push(i); });
    }
    const pend = new Set(rows.filter(o => o.status === 'pending').map(o => o.id));
    const isNew = pnl.seen && [...pend].some(id => !pnl.seen.has(id));
    if (isNew) { beep(); pnl.lastBeep = Date.now(); toast('🔔 Yeni sipariş geldi!'); }
    else if (pend.size && Date.now() - pnl.lastBeep > 25000) { beep(); pnl.lastBeep = Date.now(); }
    document.title = pend.size ? `(${pend.size}) Yeni sipariş – Akar Yemek` : 'Restoran paneli – Akar Yemek';
    pnl.seen = pend; pnl.orders = rows; renderPanel();
  } catch (e) { const b = $('#pbody'); if (b && !pnl.orders.length && sess) b.innerHTML = `<p class="err">Siparişler alınamadı (${esc(e.message)})</p>`; }
}
async function setStatus(id, to) {
  if (to === 'cancelled' && !confirm('Siparişi iptal etmek istiyor musun?')) return;
  try {
    await fresh();
    const res = await fetch(SB_URL + '/rest/v1/rpc/set_order_status', { method: 'POST', headers: hdr(), body: JSON.stringify({ p_order_id: id, p_status: to }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.message || 'Durum değiştirilemedi');
    const o = pnl.orders.find(x => x.id === id); if (o) o.status = to;
    renderPanel(); toast('Güncellendi ✓');
  } catch (e) { toast(e.message); }
}
async function toggleOpen() {
  const r = cur(), nv = r.is_open === false;
  try { await patchRow('restaurants?id=eq.' + encodeURIComponent(r.id), { is_open: nv }); r.is_open = nv; drawPanel(); renderPanel(); toast(nv ? 'Restoran açıldı' : 'Restoran kapatıldı'); }
  catch (e) { toast(e.message); }
}
function toggleSound() {
  pnl.sound = !pnl.sound;
  if (pnl.sound) { try { pnl.ctx = pnl.ctx || new (window.AudioContext || window.webkitAudioContext)(); pnl.ctx.resume(); } catch (e) {} beep(); keepAwake(); }
  drawPanel(); renderPanel();
}
async function setTab(k) {
  pnl.tab = k; renderPanel();
  if (k === 'menu' && pnl.menu === null) {
    try { pnl.menu = await api('menu_items?select=id,name,price,is_available&restaurant_id=eq.' + encodeURIComponent(pnl.rid) + '&order=name'); } catch (e) { pnl.menu = []; toast(e.message); }
    renderPanel();
  }
}
async function toggleItem(id) {
  const m = (pnl.menu || []).find(x => x.id === id); if (!m) return;
  try { await patchRow('menu_items?id=eq.' + encodeURIComponent(id), { is_available: !m.is_available }); m.is_available = !m.is_available; renderPanel(); toast(m.is_available ? 'Satışa açıldı' : 'Tükendi olarak işaretlendi'); }
  catch (e) { toast(e.message); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if ('rsignup' in d) return signupView();
  if ('rlogin' in d) return showLogin();
  if ('rsignupgo' in d) return doSignup();
  if ('verify' in d) return verifyCode();
  if ('resend' in d) return resendCode();
  if ('rsubmit' in d) return registerRest();
  if ('rrefresh' in d) return start();
  if ('login' in d) return doLogin();
  if ('out' in d) { signOut(); clearInterval(pnl.timer); try { pnl.wake && pnl.wake.release(); } catch (x) {} pnl = { ...pnl, rests: [], rid: null, orders: [], items: {}, menu: null, seen: null, sound: false, wake: null }; document.title = 'Restoran paneli – Akar Yemek'; return showLogin(); }
  if ('popen' in d) return toggleOpen();
  if ('psound' in d) return toggleSound();
  if (d.pst) return setStatus(d.pst, d.to);
  if (d.ptab) return setTab(d.ptab);
  if (d.pitem) return toggleItem(d.pitem);
});
document.addEventListener('change', e => {
  if (e.target.id === 'prest') { pnl.rid = e.target.value; pnl.seen = null; pnl.items = {}; pnl.orders = []; pnl.menu = null; pnl.tab = 'new'; drawPanel(); renderPanel(); pollPanel(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'em' || e.target.id === 'pw')) { e.preventDefault(); doLogin(); }
  if (e.key === 'Enter' && (e.target.id === 'sem' || e.target.id === 'spw')) { e.preventDefault(); doSignup(); }
  if (e.key === 'Enter' && e.target.id === 'cd') { e.preventDefault(); verifyCode(); }
});

(async () => { await fresh(); who(); sess ? start() : showLogin(); })();
</script>
</body>
</html>
