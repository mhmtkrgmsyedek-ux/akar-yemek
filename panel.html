#toast.show{opacity:1;transform:translateX(-50%)}
a{color:var(--red-d)}
.sw{color:var(--red);font-weight:700;margin-top:12px;padding:6px 0;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.wide{max-width:560px;margin:24px auto}

.big{width:100%;padding:16px;font-size:17px;margin:10px 0}

.pmi{flex-wrap:wrap}.pmi>span:last-child{display:flex;gap:6px;flex-wrap:wrap}

const authMsg = m => {
  m = String(m || '');

  if (/already registered|already been registered/i.test(m)) return 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
  if (/password.*(short|least|characters)|weak/i.test(m)) return 'Şifre en az 8 karakter olmalı ve hem harf hem rakam içermeli.';
  if (/valid email|invalid.*email|unable to validate email/i.test(m)) return 'Geçerli bir e-posta adresi yaz.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Çok fazla deneme yapıldı. Bir dakika bekleyip tekrar dene.';

const authReq = async (path, body) => {
  const r = await fetch(SB_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'İşlem başarısız');
  return j;
};
const toSess = j => ({ token: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000, uid: j.user.id, email: j.user.email });
async function fresh() {
  if (sess && sess.exp < Date.now()) {
    try { save(toSess(await authReq('token?grant_type=refresh_token', { refresh_token: sess.refresh }))); } catch (e) { save(null); }
  }
}
const api = async path => {
  await fresh();
  if (!sess) { showLogin(); throw new Error('Oturum kapandı'); }

};

};

}

const postRow = async (path, body) => {

async function registerRest() {

  if (!/^[\d\s+()-]{7,20}$/.test(phone)) { el.textContent = 'Geçerli bir telefon numarası yaz.'; return; }

function beep() {
  if (!pnl.sound) return;
  try {
    const c = pnl.ctx || (pnl.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (c.state === 'suspended') c.resume();
    [0, .28, .56].forEach(t => {

async function pollPanel() {
  const rid = pnl.rid;
  try {
    const rows = await api('orders?select=*&restaurant_id=eq.' + encodeURIComponent(rid) + '&order=created_at.desc&limit=60');
    if (rid !== pnl.rid || !$('#pnl')) return;
    const need = rows.filter(o => isId(o.id) && !(o.id in pnl.items)).map(o => o.id);
    if (need.length) {
      const its = await api('order_items?select=*&order_id=in.(' + need.join(',') + ')');
      need.forEach(id => { pnl.items[id] = []; });
      its.forEach(i => { if (pnl.items[i.order_id]) pnl.items[i.order_id].push(i); });
    }
    const pend = new Set(rows.filter(o => o.status === 'pending').map(o => o.id));
    const isNew = pnl.seen && [...pend].some(id => !pnl.seen.has(id));

}
async function proposeCoupon() {
  const v = id => ($('#' + id).value || '').trim(), code = v('pc').toUpperCase(), type = v('pt'), val = Number(v('pv').replace(',', '.')), min = Number(v('pm').replace(',', '.') || 0), lim = v('pl') ? parseInt(v('pl'), 10) : null;
  if (!/^[A-Z0-9]{4,20}$/.test(code)) return toast('Kod 4-20 harf/rakam olmalı');
  if (!isFinite(val) || val <= 0 || (type === 'yuzde' && val > 50)) return toast(type === 'yuzde' ? 'Yüzde 1 ile 50 arasında olmalı' : 'Geçerli bir tutar yaz');
  if (!isFinite(min) || min < 0 || (lim !== null && !(lim > 0))) return toast('Min. sepet ve sınırı kontrol et');
  const exp = v('pe') ? new Date(v('pe') + 'T23:59:59+03:00').toISOString() : null;
  try {
    await fresh(); const res = await fetch(SB_URL + '/rest/v1/rpc/restaurant_propose_coupon', { method: 'POST', headers: hdr(), body: JSON.stringify({ p_restaurant: pnl.rid, p_code: code, p_type: type, p_value: val, p_min: min, p_expires: exp, p_limit: lim }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(/duplicate|unique/i.test(j.message || '') ? 'Bu kupon kodu kullanılıyor' : (j.message || 'Gönderilemedi'));
    await loadPromos(); renderPanel(); toast('Onaya gönderildi ✓');
  } catch (e) { toast(e.message); }
}
async function delPromo(id) {
  if (!confirm('Kampanya silinsin mi?')) return;
  try { await fresh(); const r = await fetch(SB_URL + '/rest/v1/coupons?id=eq.' + encodeURIComponent(id), { method: 'DELETE', headers: hdr() }); if (!r.ok) throw new Error('Silinemedi'); await loadPromos(); renderPanel(); toast('Silindi'); } catch (e) { toast(e.message); }
}
const ymd = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function earnHtml() {
  const t = ymd(new Date()), w = ymd(new Date(Date.now() - 6 * 864e5)), m = ymd(new Date(Date.now() - 29 * 864e5));
  return `<div class="mf"><b>Kazançlarım</b><div class="prow"><button class="ghost" data-erange="${t}|${t}">Bugün</button><button class="ghost" data-erange="${w}|${t}">7 gün</button><button class="ghost" data-erange="${m}|${t}">30 gün</button></div>
<div class="two"><div><label for="ef">Başlangıç</label><input id="ef" type="date" value="${w}"></div><div><label for="et">Bitiş</label><input id="et" type="date" value="${t}"></div></div>
<div class="prow"><button class="go" data-ego>Göster</button></div></div><div id="ebody"></div>`;
}
async function loadEarn() {
  const f = $('#ef') && $('#ef').value, t = $('#et') && $('#et').value; if (!f || !t || f > t) return toast('Tarih aralığını kontrol et');
  $('#ebody').innerHTML = '<p class="info">Hesaplanıyor…</p>';
  try {
    await fresh(); const res = await fetch(SB_URL + '/rest/v1/rpc/restaurant_earnings', { method: 'POST', headers: hdr(), body: JSON.stringify({ p_restaurant: pnl.rid, p_from: f, p_to: t }) });
    const j = await res.json(); if (!res.ok) throw new Error(j.message || 'Hesaplanamadı');
    let cf = 0; try { const r2 = await fetch(SB_URL + '/rest/v1/rpc/restaurant_courier_fees', { method: 'POST', headers: hdr(), body: JSON.stringify({ p_restaurant: pnl.rid, p_from: f, p_to: t }) }); if (r2.ok) cf = Number(await r2.json()) || 0; } catch (e) {}
    const n = Number(j.delivered_count) || 0, k = (a, b, c) => `<div><span>${a}</span><b${c ? ` style="color:var(--green)"` : ''}>${b}</b></div>`;
    $('#ebody').innerHTML = `<div class="kpi">${k('Ciro (yemek tutarı)', tl(j.gross))}${k('Net kazancın', tl(j.net - cf), 1)}${k('Platform komisyonu (%' + esc(j.rate) + ')', tl(j.commission))}${k('Kendi kupon indirimin', tl(j.discount))}${k('Kurye ücretleri', tl(cf))}${k('Teslim edilen', n)}${k('İptal edilen', esc(j.cancelled_count))}${k('Ortalama sepet', tl(n ? j.gross / n : 0))}</div>` + ((j.top_items || []).length ? `<div class="mf"><b>En çok satanlar</b>${j.top_items.map(x => `<div class="pmi"><span>${esc(x.name)}</span><b>${esc(x.qty)} adet · ${tl(x.total)}</b></div>`).join('')}</div>` : '');
  } catch (e) { $('#ebody').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
async function toggleItem(id) {
  const m = (pnl.menu || []).find(x => x.id === id); if (!m) return;
  try { await patchRow('menu_items?id=eq.' + encodeURIComponent(id), { is_available: !m.is_available }); m.is_available = !m.is_available; renderPanel(); toast(m.is_available ? 'Satışa açıldı' : 'Tükendi olarak işaretlendi'); }
  catch (e) { toast(e.message); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if ('rsignup' in d) return signupView();
  if ('rlogin' in d) return showLogin();
  if ('rsignupgo' in d) return doSignup();
  if ('verify' in d) return verifyCode();
  if ('resend' in d) return resendCode();
  if ('rsubmit' in d) return registerRest();
  if ('rrefresh' in d) return start();
  if ('login' in d) return doLogin();
  if ('out' in d) { signOut(); clearInterval(pnl.timer); try { pnl.wake && pnl.wake.release(); } catch (x) {} pnl = { ...pnl, rests: [], rid: null, orders: [], items: {}, menu: null, seen: null, sound: false, wake: null }; document.title = 'Restoran paneli – Akar Yemek'; return showLogin(); }
  if ('popen' in d) return toggleOpen();
  if ('psound' in d) return toggleSound();
  if (d.pst) return setStatus(d.pst, d.to);
  if (d.ptab) return setTab(d.ptab);
  if (d.pitem) return toggleItem(d.pitem);
  if ('msave' in d) return saveItem(); if ('mclear' in d) return renderPanel(); if (d.medit) return editItem(d.medit); if (d.mdel) return delItem(d.mdel); if ('cadd' in d) return addCat(); if ('ego' in d) return loadEarn(); if ('cprop' in d) return proposeCoupon(); if ('kreq' in d) return requestCourier(); if ('kref' in d) return setTab('courier'); if (d.kcancel) return confirm('İstek iptal edilsin mi?') && courierRpc('cancel_courier_request', { p_id: d.kcancel }, 'İptal edildi'); if (d.cdel) return delPromo(d.cdel);
  if (d.erange) { const [a, z] = d.erange.split('|'); $('#ef').value = a; $('#et').value = z; return loadEarn(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'prest') { pnl.rid = e.target.value; pnl.seen = null; pnl.items = {}; pnl.orders = []; pnl.menu = null; pnl.tab = 'new'; drawPanel(); renderPanel(); pollPanel(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'em' || e.target.id === 'pw')) { e.preventDefault(); doLogin(); }
  if (e.key === 'Enter' && (e.target.id === 'sem' || e.target.id === 'spw')) { e.preventDefault(); doSignup(); }
  if (e.key === 'Enter' && e.target.id === 'cd') { e.preventDefault(); verifyCode(); }
});

(async () => { await fresh(); who(); sess ? start() : showLogin(); })();
</script>
</body>
</html>
