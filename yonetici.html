    return `${C}${I(nf, m[nf], 0, 0, 'Ürün adı')}<div class="prow">${I('price', m.price, 'number', '110px', '₺')}${B('menu_items', m.id, 'save', 'Kaydet', 'go')}${a ? B('menu_items', m.id, 'set', m[a] === false ? 'Satışa aç' : 'Satıştan kaldır', 0, { [a]: m[a] === false }) : ''}${B('menu_items', m.id, 'del', 'Sil')}</div></div>`; }).join('') || E);
  if (tt === 'promo') b.innerHTML = rows.map(c => `${C}<b>${esc(c.code)}</b> <span class="badge">${esc((c.restaurants || {}).name || 'Platform')}</span> <span class="badge">${ST[c.approval_status] || esc(c.approval_status)}${c.is_active ? '' : ' · pasif'}</span><p class="info">${c.discount_type === 'yuzde' ? '%' + esc(c.discount_value) : tl(c.discount_value)} · min. ${tl(c.min_order_amount)}${c.usage_limit ? ' · ' + esc(c.usage_limit) + ' kullanım' : ''}${c.expires_at ? ' · ' + esc(new Date(c.expires_at).toLocaleDateString('tr-TR')) + ' tarihine kadar' : ''}</p><div class="prow">${c.approval_status !== 'approved' ? B('coupons', c.id, 'set', 'Onayla', 'go', { approval_status: 'approved', is_active: true, reject_reason: null }) : B('coupons', c.id, 'set', c.is_active ? 'Pasifleştir' : 'Aktifleştir', 0, { is_active: !c.is_active })}${c.approval_status !== 'rejected' ? B('coupons', c.id, 'rej', 'Reddet') : ''}${B('coupons', c.id, 'del', 'Sil')}</div></div>`).join('') || E;
  if (tt === 'cour') { const act = new Set((pnl.d.active || []).map(x => x.courier_id)), pf = {}; (pnl.d.perf || []).forEach(x => { const p = pf[x.courier_id] || (pf[x.courier_id] = { n: 0, s: 0, k: 0 }); p.n++; if (x.accepted_at && x.delivered_at) { p.s += (new Date(x.delivered_at) - new Date(x.accepted_at)) / 6e4; p.k++; } });
    b.innerHTML = [...rows].sort((a, z) => (a.status === 'pending' ? 0 : 1) - (z.status === 'pending' ? 0 : 1)).map(c => { const p = pf[c.id], st = c.status !== 'approved' ? (ST[c.status] || esc(c.status)) : act.has(c.id) ? '🛵 Çağrıda' : c.is_online ? '🟢 Çevrimiçi' : '⚪ Çevrimdışı'; return `${C}<b>${esc(c.full_name)}</b> <span class="badge">${st}</span><p class="info">📞 <a href="tel:${esc(telOf(c.phone))}">${esc(c.phone)}</a>${p ? ` · ${p.n} teslimat${p.k ? ' · ort. ' + Math.round(p.s / p.k) + ' dk' : ''}` : ' · henüz teslimat yok'}</p><div class="prow">${c.status !== 'approved' ? B('courier_profiles', c.id, 'set', 'Onayla', 'go', { status: 'approved' }) : ''}${c.status !== 'suspended' ? B('courier_profiles', c.id, 'set', 'Askıya al', 0, { status: 'suspended' }) : ''}${B('courier_profiles', c.id, 'del', 'Sil')}</div></div>`; }).join('') || E; }
  if (tt === 'ord') { const sts = [...new Set([...rows.map(o => o.status), 'cancelled'])]; pnl.csv = { name: 'siparisler', rows: [['Tarih', 'Restoran', 'Ödeme', 'Tutar', 'Durum'], ...rows.map(o => [new Date(o.created_at).toLocaleString('tr-TR'), (o.restaurants || {}).name || '', o.payment_method || '', Number(o.total_amount) || 0, o.status])] }; b.innerHTML = '<button class="ghost" data-do="csv">⬇ Excel (CSV) indir</button>' + rows.map(o => `${C}<b>${esc((o.restaurants || {}).name || '')}</b> · <b>${tl(o.total_amount)}</b><p class="info">${esc(new Date(o.created_at).toLocaleString('tr-TR'))} · ${esc(PAYS[o.payment_method] || o.payment_method || '')}</p><div class="prow"><select data-ost="${esc(o.id)}">${sts.map(s => `<option${s === o.status ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select>${B('orders', o.id, 'del', 'Sil')}</div></div>`).join('') || E; }
  if (tt === 'set') b.innerHTML = rows.map(s => `<div class="mf" data-card><b>${esc(s.key)}</b>${s.key === 'courier_fee' ? '<p class="hint">Restoranın her kurye isteğinde ödediği sabit ücret (₺).</p>' : ''}<div class="prow">${I('value', s.value, 0, 0, 'Değer')}${B('app_settings', s.key, 'save', 'Kaydet', 'go', 0, 'key')}</div></div>`).join('') + `<div class="mf"><b>Yeni ayar ekle</b><div class="prow"><input id="nk" placeholder="anahtar"><input id="nv" placeholder="değer"><button class="go" data-do="newset">Ekle</button></div></div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if ('login' in d) return doLogin();
  if ('out' in d) { signOut(); return showLogin(); }
  if (d.atab) { pnl.tab = d.atab; return load(); }
  let job = null; const a = d.do, k = d.k || 'id', q = () => d.t + '?' + k + '=eq.' + encodeURIComponent(d.id);
  if (a && !/^(new|setfee|csv|pay)/.test(a) && !TBL.includes(d.t)) return;
  if (a === 'save') { const o = {}; b.closest('[data-card]').querySelectorAll('[data-f]').forEach(i => { o[i.dataset.f] = i.type === 'number' ? Number(i.value) : i.value.trim(); });
    if ('commission_rate' in o && !(o.commission_rate >= 0 && o.commission_rate <= 50)) return toast('Komisyon 0 ile 50 arasında olmalı');
    if ('name' in o && !o.name) return toast('Ad boş olamaz'); if ('price' in o && !(o.price >= 0)) return toast('Geçerli bir fiyat yaz');
    if ('open_time' in o) { o.open_time = o.open_time || null; o.close_time = o.close_time || null; }
    job = () => pch(q(), o); }
  if (a === 'set') job = () => pch(q(), JSON.parse(d.v));
  if (a === 'rej') { const why = prompt('Red nedeni (restoran görecek):'); if (why === null) return; job = () => pch(q(), { approval_status: 'rejected', is_active: false, reject_reason: why.trim() || 'Uygun bulunmadı' }); }
  if (a === 'del') { if (!confirm('Bu kayıt kalıcı olarak silinecek. Emin misin?')) return; job = () => mut('DELETE', q()); }
  if (a === 'newset') { const key = $('#nk').value.trim(), val = $('#nv').value.trim(); if (!key) return toast('Anahtar yaz'); job = () => mut('POST', 'app_settings', { key, value: val }, ',resolution=merge-duplicates'); }
  if (a === 'newrest') { const name = $('#nrn').value.trim(); if (!name) return toast('Restoran adı yaz'); job = () => mut('POST', 'restaurants', { name, phone: $('#nrp').value.trim() || null, city: $('#nrc').value.trim() || null, district: $('#nrd').value.trim() || null, commission_rate: 10, is_active: true, is_open: true, owner_id: sess.uid, address: $('#nra').value.trim() || '', delivery_fee: Number($('#nrf').value) || 0, cuisine_id: $('#nrcu').value || null }); }
  if (a === 'newitem') { const name = $('#nin').value.trim(), pv = $('#nip').value, price = Number(pv); if (!pnl.sel) return toast('Önce restoran seç'); if (!name || pv === '' || !(price >= 0)) return toast('Ürün adı ve fiyat yaz'); const f0 = (pnl.d.menu || [])[0] || {}; const cat = $('#nic') && $('#nic').value; if (!cat) return toast('Önce bu restoran için bir menü kategorisi ekle'); job = () => mut('POST', 'menu_items', { restaurant_id: pnl.sel, category_id: cat, is_available: true, [!('name' in f0) && 'title' in f0 ? 'title' : 'name']: name, price }); }
  if ('cref' in d) return load();
  if ('cgo' in d) { pnl.month = document.getElementById('cm').value || ''; return load(); }
  if (d.asg) { const sl = document.getElementById('as-' + d.asg); if (!sl || !sl.value) return toast('Önce onaylı bir kurye gerekli'); job = () => pch('courier_requests?id=eq.' + enc(d.asg), { courier_id: sl.value, status: 'assigned', accepted_at: new Date().toISOString() }); }
  if (d.rel) job = () => pch('courier_requests?id=eq.' + enc(d.rel), { courier_id: null, status: 'open', accepted_at: null });
  if (d.rcan) { if (!confirm('Çağrı iptal edilsin mi?')) return; job = () => pch('courier_requests?id=eq.' + enc(d.rcan), { status: 'cancelled' }); }
  if (a === 'csv') { if (pnl.csv) csv(pnl.csv.name, pnl.csv.rows); return; }
  if (a === 'paydo') job = () => mut('POST', 'payouts', { kind: d.kind, payee_id: d.id, period_start: d.ps, period_end: d.pe, amount: Number(d.amt) });
  if (a === 'payundo') { if (!confirm('Ödendi işareti kaldırılsın mı?')) return; job = () => mut('DELETE', 'payouts?id=eq.' + encodeURIComponent(d.id)); }
  if (a === 'setfee') { const v = Number($('#' + d.i).value); if (!isFinite(v) || v < 0 || v > 1000) return toast('Geçerli bir ücret yaz'); job = () => mut('POST', 'app_settings', { key: d.k, value: String(v) }, ',resolution=merge-duplicates'); }
  if (a === 'newmcat') { const name = $('#nmc').value.trim(); if (!name || !pnl.sel) return toast('Kategori adı yaz'); job = () => mut('POST', 'menu_categories', { restaurant_id: pnl.sel, name }); }
  if (a === 'newcat') { const name = $('#ncn').value.trim(); if (!name) return toast('Kategori adı yaz'); job = () => mut('POST', 'cuisines', { name, emoji: $('#nce').value.trim() || '🍽️' }); }
  if (job) { try { await job(); toast('Kaydedildi ✓'); await load(); } catch (x) { toast(x.message); } }
});
document.addEventListener('change', async e => {
  const s = e.target;
  if (s.id === 'msel') { pnl.sel = s.value; return load(); }
  if (s.id === 'per') { pnl.per = s.value; return load(); }
  if (s.dataset.urole) { if (s.dataset.urole === sess.uid) { toast('Kendi rolünü değiştiremezsin'); return load(); } if (!confirm('Kullanıcının rolü değişecek. Emin misin?')) return load(); try { await pch('profiles?id=eq.' + encodeURIComponent(s.dataset.urole), { role: s.value }); toast('Rol güncellendi ✓'); } catch (x) { toast(x.message); } return load(); }
  if (s.dataset.ost) { try { await pch('orders?id=eq.' + encodeURIComponent(s.dataset.ost), { status: s.value }); toast('Durum güncellendi ✓'); } catch (x) { toast(x.message); } load(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'em' || e.target.id === 'pw')) { e.preventDefault(); doLogin(); }
});
(async () => { await fresh(); who(); sess ? start() : showLogin(); })();
</script>
