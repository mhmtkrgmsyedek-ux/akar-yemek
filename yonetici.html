<style>
:root{--red:#e53d32;--red-d:#b92c23;--ink:#202124;--muted:#6f7378;--line:#eee5df;--green:#16865b;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#faf7f4;padding-bottom:env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0))}
.brand{display:flex;align-items:center;gap:8px;font-family:Poppins,Inter,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.7px;line-height:1}
.brand svg{width:34px;height:34px}.brand b{color:var(--red)}
.brand small{display:block;font-family:Inter,sans-serif;font-weight:700;font-size:11px;letter-spacing:0;color:var(--muted);margin-top:3px}

.title{font-size:24px;letter-spacing:-.5px;margin:6px 0 4px}
.info{color:var(--muted);margin:0 0 8px}
.err{color:var(--err);background:#fff;border:1px solid var(--err);padding:12px;border-radius:12px}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
label{display:block;font-weight:700;margin:14px 0 5px;font-size:14px}
.login{max-width:400px;margin:40px auto}

.ptabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.ptabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font-weight:750;font-size:14px;white-space:nowrap}
.ptabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.ptabs i{font-style:normal;background:#fff;color:var(--red);border-radius:99px;padding:1px 7px;margin-left:4px;font-size:12px;font-weight:800}
.ocard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}
.ocard.fresh{border-color:var(--red);box-shadow:0 0 0 3px #e53d3222}
.pit{margin:8px 0;padding-left:20px;font-weight:650}
.pmi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.pmi button{border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-weight:750;font-size:13px;white-space:nowrap;background:#fff}
.pmi button.off{background:var(--ink);color:#fff;border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
a{color:var(--red-d)}
.sw{color:var(--red);font-weight:700;margin-top:12px;padding:6px 0;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.wide{max-width:560px;margin:24px auto}

.big{width:100%;padding:16px;font-size:17px;margin:10px 0}

.pmi{flex-wrap:wrap}.pmi>span:last-child{display:flex;gap:6px;flex-wrap:wrap}

<script>
const SB_URL = 'https://bspjvnxnofkhnocjwsjb.supabase.co';
const SB_KEY = 'sb_publishable_LYozx29A9SxRFBEXLkxftg_28peojyK';
if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location = window.self.location; } catch (e) {} }
const $ = s => document.querySelector(s);
const isId = v => typeof v === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
const telOf = v => String(v || '').replace(/[^\d+]/g, '').slice(0, 20);
const PAYS = { cash: 'Kapıda ödeme', card: 'Kredi kartı' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tl = n => (Number(n) || 0).toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';
let toastTimer;
function toast(s) { const el = $('#toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }

/* ---------- oturum ---------- */
let sess = null;
try { sess = JSON.parse(localStorage.getItem('sess') || 'null'); } catch (e) {}
const save = s => { sess = s; try { s ? localStorage.setItem('sess', JSON.stringify(s)) : localStorage.removeItem('sess'); } catch (e) {} };
const hdr = () => ({ apikey: SB_KEY, 'Content-Type': 'application/json', ...(sess ? { Authorization: 'Bearer ' + sess.token } : {}) });
const authMsg = m => {
  m = String(m || '');
  if (/invalid login|invalid_credentials/i.test(m)) return 'E-posta veya şifre hatalı.';
  if (/not confirmed/i.test(m)) return 'E-postan henüz doğrulanmamış.';
  if (/expired|invalid.*(token|otp)|token.*invalid|otp/i.test(m)) return 'Kod hatalı ya da süresi dolmuş. Yeni kod isteyebilirsin.';
  if (/already registered|already been registered/i.test(m)) return 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
  if (/password.*(short|least|characters)|weak/i.test(m)) return 'Şifre en az 8 karakter olmalı ve hem harf hem rakam içermeli.';
  if (/valid email|invalid.*email|unable to validate email/i.test(m)) return 'Geçerli bir e-posta adresi yaz.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Çok fazla deneme yapıldı. Bir dakika bekleyip tekrar dene.';
  if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.';
  return m || 'İşlem başarısız.';
};
const authReq = async (path, body) => {
  const r = await fetch(SB_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'İşlem başarısız');
  return j;
};
const toSess = j => ({ token: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000, uid: j.user.id, email: j.user.email });
async function fresh() {
  if (sess && sess.exp < Date.now()) {
    try { save(toSess(await authReq('token?grant_type=refresh_token', { refresh_token: sess.refresh }))); } catch (e) { save(null); }
  }
}
const api = async path => {
  await fresh();
  if (!sess) { showLogin(); throw new Error('Oturum kapandı'); }
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: hdr() });
  if (r.status === 401) { save(null); showLogin(); throw new Error('Oturum kapandı'); }
  if (!r.ok) throw new Error('Sunucu hatası: ' + r.status);
  return r.json();
};
const patchRow = async (path, body) => {
  await fresh();
  const r = await fetch(SB_URL + '/rest/v1/' + path, { method: 'PATCH', headers: { ...hdr(), Prefer: 'return=minimal' }, body: JSON.stringify(body) });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || ('Sunucu hatası: ' + r.status)); }
};
async function signOut() {
  const t = sess && sess.token;
  save(null);
  if (t) { try { await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + t } }); } catch (e) {} }
}
function who() { $('#who').innerHTML = sess ? `<span>${esc(sess.email)}</span><button class="ghost" data-out>Çıkış</button>` : ''; }

/* ---------- giriş ---------- */
function showLogin() {
  clearInterval(pnl.timer); who();
  $('#app').innerHTML = `<div class="wrap"><div class="login card"><h2 class="title">Yönetici girişi</h2><p class="info">Yönetici hesabınla giriş yap.</p>
<label for="em">E-posta</label><input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false">
<label for="pw">Şifre</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="none">
<p id="aerr" class="err" hidden style="margin:12px 0 0"></p>
<button class="go" data-login>Giriş yap</button>
</div></div>`;
}
let authBusy = false, authFails = 0, authLock = 0;
async function doLogin() {
  if (authBusy) return;
  const email = $('#em').value.trim().toLowerCase(), password = $('#pw').value, el = $('#aerr'), btn = $('[data-login]');
  el.hidden = false;
  if (!email || !password) { el.textContent = 'E-posta ve şifreyi yaz.'; return; }
  if (Date.now() < authLock) { el.textContent = 'Çok fazla deneme yaptın. ' + Math.ceil((authLock - Date.now()) / 1000) + ' saniye sonra tekrar dene.'; return; }
  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try { save(toSess(await authReq('token?grant_type=password', { email, password }))); authFails = 0; who(); await start(); }
  catch (e) { if (++authFails >= 5) { authLock = Date.now() + 60000; authFails = 0; } el.hidden = false; el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-login]')) $('[data-login]').disabled = false; }
}


/* ---------- restoran kaydı ---------- */
let codeEmail = '', resendAt = 0;
function signupView() {
  clearInterval(pnl.timer); who();
  $('#app').innerHTML = `<div class="wrap"><div class="wide card"><h2 class="title">Restoran olarak kayıt ol</h2><p class="info">Önce hesabını oluştur, sonra restoranının bilgilerini gireceksin.</p>
<label for="sem">E-posta</label><input id="sem" type="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false">
<label for="spw">Şifre (en az 8 karakter, harf ve rakam)</label><input id="spw" type="password" autocomplete="new-password" autocapitalize="none">
<p id="serr" class="err" hidden style="margin:12px 0 0"></p>
<button class="go" data-rsignupgo>Kayıt ol</button>
<button class="sw" data-rlogin>Hesabın var mı? Giriş yap</button></div></div>`;
  scrollTo(0, 0);
}
async function doSignup() {
  if (authBusy) return;
  const email = $('#sem').value.trim().toLowerCase(), password = $('#spw').value, el = $('#serr'), btn = $('[data-rsignupgo]');
  el.hidden = false;
  if (!email || !password) { el.textContent = 'E-posta ve şifreyi yaz.'; return; }
  if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) { el.textContent = 'Şifre en az 8 karakter olmalı ve hem harf hem rakam içermeli.'; return; }
  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try {
    const j = await authReq('signup', { email, password });
    if (!j.access_token) {
      if (j.user && Array.isArray(j.user.identities) && !j.user.identities.length) { el.textContent = 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.'; return; }
      return codeView(email);
    }
    save(toSess(j)); who(); await start();
  } catch (e) { el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-rsignupgo]')) $('[data-rsignupgo]').disabled = false; }
}
function codeView(email, note) {
  codeEmail = email;
  $('#app').innerHTML = `<div class="wrap"><div class="wide card"><h2 class="title">E-postanı doğrula</h2>
<p class="info">${esc(note || 'Hesabını doğrulamak için e-postana bir kod gönderdik.')}</p><p class="info"><b>${esc(email)}</b> adresine gelen kodu yaz. Gelmediyse spam klasörüne de bak.</p>
<label for="cd">Doğrulama kodu</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Örn. 123456">
<p id="cderr" class="err" hidden style="margin:12px 0 0"></p>
<button class="go" data-verify>Doğrula</button>
<button class="sw" data-resend>Kodu tekrar gönder</button></div></div>`;
  scrollTo(0, 0);
  const i = $('#cd'); if (i) i.focus();
}
async function verifyCode() {
  if (authBusy) return;
  const el = $('#cderr'), btn = $('[data-verify]');
  const token = ($('#cd').value || '').replace(/\s+/g, '');
  el.hidden = false;
  if (!/^\d{4,10}$/.test(token)) { el.textContent = 'E-postana gelen kodu rakamlarla yaz.'; return; }
  authBusy = true; btn.disabled = true; el.textContent = 'Bekle…';
  try {
    const j = await authReq('verify', { type: 'signup', email: codeEmail, token });
    if (!j.access_token) throw new Error('Doğrulama tamamlanamadı. Tekrar dene.');
    save(toSess(j)); who(); await start();
  } catch (e) { el.textContent = authMsg(e.message); }
  finally { authBusy = false; if ($('[data-verify]')) $('[data-verify]').disabled = false; }
}
async function resendCode() {
  const el = $('#cderr'); el.hidden = false;
  const wait = Math.ceil((resendAt - Date.now()) / 1000);
  if (wait > 0) { el.textContent = 'Yeni kod için ' + wait + ' saniye bekle.'; return; }
  el.textContent = 'Gönderiliyor…';
  try { await authReq('resend', { type: 'signup', email: codeEmail }); resendAt = Date.now() + 60000; el.textContent = 'Yeni kod gönderildi. Gelen kutunu ve spam klasörünü kontrol et.'; }
  catch (e) { el.textContent = authMsg(e.message); }
}

let pnl = { tab: 'rest', d: {} };
const TABS = [['rest', 'Restoranlar'], ['promo', 'Kampanyalar'], ['cour', 'Kuryeler'], ['ord', 'Siparişler'], ['set', 'Ayarlar']];
const Q = { rest: 'restaurants?select=id,name,city,district,phone,is_active,is_paused,commission_rate&order=is_active.asc,created_at.desc&limit=100', promo: 'coupons?select=id,code,discount_type,discount_value,min_order_amount,expires_at,usage_limit,restaurants(name)&approval_status=eq.pending&order=created_at.desc', cour: 'courier_profiles?select=*&order=created_at.desc', ord: 'orders?select=id,status,total_amount,payment_method,created_at,restaurants(name)&order=created_at.desc&limit=50', set: 'app_settings?select=key,value' };
async function pch(path, body) {
  await fresh(); const r = await fetch(SB_URL + '/rest/v1/' + path, { method: 'PATCH', headers: { ...hdr(), Prefer: 'return=representation' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.message || 'Kaydedilemedi'); if (!Array.isArray(j) || !j.length) throw new Error('Yetkin yok veya kayıt bulunamadı');
}
async function start() {
  $('#app').innerHTML = '<div class="wrap"><p class="info">Yükleniyor…</p></div>';
  try {
    const r = await api('profiles?select=role&id=eq.' + encodeURIComponent(sess.uid));
    if (!r[0] || r[0].role !== 'admin') { $('#app').innerHTML = '<div class="wrap"><div class="wide card"><h2 class="title">Yetkin yok</h2><p class="info">Bu sayfa sadece yöneticiler içindir.</p><button class="ghost" data-out>Çıkış yap</button></div></div>'; return; }
  } catch (e) { $('#app').innerHTML = `<div class="wrap"><p class="err">${esc(e.message)}</p></div>`; return; }
  $('#app').innerHTML = '<div class="wrap" id="adm"><h2 class="title">Yönetici paneli</h2><div class="ptabs" id="atabs"></div><div id="abody"></div></div>'; load();
}
async function load() {
  render(true);
  try { pnl.d[pnl.tab] = await api(Q[pnl.tab]); } catch (e) { pnl.d[pnl.tab] = []; toast(e.message); }
  render();
}
const ST = { pending: '⏳ Onay bekliyor', approved: '✅ Onaylı', suspended: '⏸ Askıda' };
function render(wait) {
  const t = $('#atabs'), b = $('#abody'); if (!t || !b) return;
  t.innerHTML = TABS.map(([k, n]) => `<button data-atab="${k}" class="${pnl.tab === k ? 'on' : ''}">${n}</button>`).join('');
  const rows = pnl.d[pnl.tab]; if (wait || !rows) { b.innerHTML = '<p class="info">Yükleniyor…</p>'; return; }
  const tt = pnl.tab, E = '<div class="empty">Kayıt yok.</div>';
  if (tt === 'rest') b.innerHTML = rows.map(r => `<div class="ocard"><b>${esc(r.name)}</b> <span class="badge">${!r.is_active ? '⏳ Onay bekliyor' : r.is_paused ? '⏸ Sipariş almıyor' : '✅ Açık'}</span><p class="info">${esc(r.city || '')} ${esc(r.district || '')} · ${esc(r.phone || '')}</p><div class="prow"><input id="cm-${esc(r.id)}" type="number" min="0" max="50" step="0.5" value="${esc(r.commission_rate ?? 10)}" style="max-width:90px"><button data-rcom="${esc(r.id)}">Komisyon % kaydet</button>${r.is_active ? `<button class="ghost" data-rcls="${esc(r.id)}">Yayından kaldır</button>` : `<button class="go" data-rapp="${esc(r.id)}">Onayla</button>`}</div></div>`).join('') || E;
  if (tt === 'promo') b.innerHTML = rows.map(c => `<div class="ocard"><b>${esc(c.code)}</b> <span class="badge">${esc((c.restaurants || {}).name || 'Platform')}</span><p class="info">${c.discount_type === 'yuzde' ? '%' + esc(c.discount_value) : tl(c.discount_value)} · min. ${tl(c.min_order_amount)}${c.usage_limit ? ' · ' + esc(c.usage_limit) + ' kullanım' : ''}${c.expires_at ? ' · ' + esc(new Date(c.expires_at).toLocaleDateString('tr-TR')) + ' tarihine kadar' : ''}</p><div class="prow"><button class="go" data-papp="${esc(c.id)}">Onayla</button><button class="ghost" data-prej="${esc(c.id)}">Reddet</button></div></div>`).join('') || '<div class="empty">Onay bekleyen kampanya yok.</div>';
  if (tt === 'cour') b.innerHTML = [...rows].sort((a, z) => (a.status === 'pending' ? 0 : 1) - (z.status === 'pending' ? 0 : 1)).map(c => `<div class="ocard"><b>${esc(c.full_name)}</b> <span class="badge">${ST[c.status] || esc(c.status)}</span><p class="info">📞 <a href="tel:${esc(telOf(c.phone))}">${esc(c.phone)}</a></p><div class="prow">${c.status !== 'approved' ? `<button class="go" data-capp="${esc(c.id)}">Onayla</button>` : ''}${c.status !== 'suspended' ? `<button class="ghost" data-csus="${esc(c.id)}">Askıya al</button>` : ''}</div></div>`).join('') || E;
  if (tt === 'ord') b.innerHTML = rows.map(o => `<div class="pmi"><span><b>${esc((o.restaurants || {}).name || '')}</b><br><span class="info">${esc(new Date(o.created_at).toLocaleString('tr-TR'))} · ${esc(o.payment_method || '')}</span></span><span><b>${tl(o.total_amount)}</b> <span class="badge">${esc(o.status)}</span></span></div>`).join('') || E;
  if (tt === 'set') { const fee = (rows.find(x => x.key === 'courier_fee') || {}).value || '40'; b.innerHTML = `<div class="mf"><b>Kurye ücreti (₺)</b><p class="hint">Restoranın her kurye isteğinde ödediği sabit ücret. Yeni isteklere uygulanır.</p><div class="prow"><input id="sf" type="number" min="0" step="1" value="${esc(fee)}" style="max-width:120px"><button class="go" data-sfee>Kaydet</button></div></div>`; }
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if ('login' in d) return doLogin(); if ('rlogin' in d) return showLogin(); if ('verify' in d) return verifyCode(); if ('resend' in d) return resendCode();
  if ('out' in d) { signOut(); return showLogin(); }
  if (d.atab) { pnl.tab = d.atab; return load(); }
  let job = null, ok = 'Kaydedildi ✓';
  if (d.rapp) job = () => pch('restaurants?id=eq.' + encodeURIComponent(d.rapp), { is_active: true });
  if (d.rcls) job = () => pch('restaurants?id=eq.' + encodeURIComponent(d.rcls), { is_active: false });
  if (d.rcom) { const v = Number(document.getElementById('cm-' + d.rcom).value); if (!isFinite(v) || v < 0 || v > 50) return toast('Komisyon 0 ile 50 arasında olmalı'); job = () => pch('restaurants?id=eq.' + encodeURIComponent(d.rcom), { commission_rate: v }); }
  if (d.papp) job = () => pch('coupons?id=eq.' + encodeURIComponent(d.papp), { approval_status: 'approved', is_active: true, reject_reason: null });
  if (d.prej) { const why = prompt('Red nedeni (restoran görecek):'); if (why === null) return; job = () => pch('coupons?id=eq.' + encodeURIComponent(d.prej), { approval_status: 'rejected', is_active: false, reject_reason: why.trim() || 'Uygun bulunmadı' }); }
  if (d.capp) job = () => pch('courier_profiles?id=eq.' + encodeURIComponent(d.capp), { status: 'approved' });
  if (d.csus) job = () => pch('courier_profiles?id=eq.' + encodeURIComponent(d.csus), { status: 'suspended' });
  if ('sfee' in d) { const v = Number(document.getElementById('sf').value); if (!isFinite(v) || v < 0 || v > 1000) return toast('Geçerli bir ücret yaz'); job = () => pch('app_settings?key=eq.courier_fee', { value: String(v) }); }
  if (job) { try { await job(); toast(ok); await load(); } catch (x) { toast(x.message); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'em' || e.target.id === 'pw')) { e.preventDefault(); doLogin(); }
  if (e.key === 'Enter' && e.target.id === 'cd') { e.preventDefault(); verifyCode(); }
});
(async () => { await fresh(); who(); sess ? start() : showLogin(); })();
</script>
